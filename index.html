<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Congress Database</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9922A;--gold-light:#F0C96A;--gold-dim:#8B6520;--navy:#0A1628;--navy2:#112240;--surface:#0F1F38;--surface2:#162848;--surface3:#1E3254;--text:#E8EDF5;--text2:#A8B8CC;--text3:#6A82A0;--red:#E05252;--green:#3CB07A;--blue:#4A9EE0;--purple:#9B72CF;--border:#1E3254;--radius:12px;--warn-bg:#2A1A08;--warn-border:#8B6520}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#0D1F3C 100%);border-bottom:1px solid var(--gold-dim);padding:0 28px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:16px}
.logo{display:flex;gap:12px;align-items:center}.logo-flag{font-size:28px}.logo-text{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:var(--gold-light)}.logo-sub{font-size:11px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}.nav{display:flex;gap:4px;flex-wrap:wrap}.nav-btn{padding:7px 13px;border:0;background:transparent;color:var(--text2);font:500 13px sans-serif;border-radius:8px;cursor:pointer}.nav-btn:hover,.nav-btn.active{background:var(--surface3);color:var(--gold-light)}
.main{padding:24px 28px;max-width:1400px;margin:auto}.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}.kpi:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--gold))}.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:500;margin-bottom:6px}.kpi-value{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;line-height:1}.kpi-sub{font-size:12px;color:var(--text3);margin-top:5px}.kpi-bar{margin-top:10px;height:6px;background:var(--navy2);border-radius:999px;overflow:hidden}.kpi-bar-fill{height:100%;background:var(--accent,var(--gold));border-radius:999px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px}.panel-title{font-family:'Playfair Display',Georgia,serif;font-size:15px;color:var(--gold-light);margin-bottom:14px}.search-grid{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr;gap:10px;align-items:end}.field-group{display:flex;flex-direction:column;gap:5px}.field-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3)}.search-input,.search-select{background:var(--navy2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:9px 12px;outline:none}.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-weight:600;cursor:pointer}.btn:hover{border-color:var(--text3);color:var(--text)}
.results-count{font-size:13px;color:var(--text3);margin-bottom:12px}.results-count span{color:var(--gold-light);font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,0,0,.3)}.card.dynasty{border-color:var(--warn-border);background:var(--warn-bg)}.card.flagged{border-color:#704040;background:#341919}.card.dynasty:after{content:'👑';position:absolute;right:12px;top:12px}.card.flagged:after{content:'⚠️';position:absolute;right:12px;top:12px}.card-name{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;margin-bottom:4px;padding-right:26px}.card-sub{font:12px monospace;color:var(--text3);margin-bottom:9px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.tag{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500}.tag-blue{background:#1E2F48;color:#7BADD4}.tag-gold{background:#2A1F00;color:var(--gold-light);border:1px solid var(--gold-dim)}.tag-green{background:#1A3520;color:#5ECC7B;border:1px solid #2E6040}.tag-red{background:#341919;color:#FF9999;border:1px solid #704040}.stats{display:flex;gap:14px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}.stat-val{font:500 17px monospace;color:var(--text)}.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase}
.table-wrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--border)}table{width:100%;border-collapse:collapse;font-size:13px}thead th{background:var(--surface2);color:var(--text2);padding:11px 13px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}tbody td{padding:9px 13px;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}tbody tr:hover{background:var(--surface2)}
.insight-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}.insight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}.insight-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:10px}.bar-list{display:flex;flex-direction:column;gap:10px}.bar-row{display:grid;grid-template-columns:160px 1fr 50px;gap:10px;align-items:center;font-size:12px;color:var(--text2)}.bar-bg{height:8px;background:var(--navy2);border-radius:999px;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:var(--gold)}.muted{color:var(--text3);font-size:12px;line-height:1.6}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}.modal-overlay.open{display:flex}.modal{background:var(--navy2);border:1px solid var(--border);border-radius:16px;max-width:860px;width:100%;max-height:88vh;overflow:auto}.modal-header{padding:24px 28px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;position:sticky;top:0;background:var(--navy2)}.modal-name{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700}.modal-sub{font:13px monospace;color:var(--text3)}.modal-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:17px;cursor:pointer}.modal-body{padding:22px 28px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:22px}.info-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px}.info-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:3px}.info-val{font-size:14px;font-weight:500}.section-head{font-family:'Playfair Display',Georgia,serif;font-size:14px;color:var(--gold-light);margin:18px 0 10px}.tl-item{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:4px;flex-shrink:0}.tl-period{font:13px monospace;color:var(--gold-light);min-width:145px}.tl-detail{font-size:13px;color:var(--text2);line-height:1.5}
@media(max-width:900px){.kpi-row,.insight-row{grid-template-columns:1fr 1fr}.search-grid{grid-template-columns:1fr 1fr}.header{flex-direction:column;align-items:flex-start;padding:12px 16px}.main{padding:16px}}@media(max-width:600px){.kpi-row,.search-grid,.info-grid,.insight-row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="logo"><span class="logo-flag">🇵🇭</span><div><div class="logo-text">PH Congress Database</div><div class="logo-sub">District Representatives + Partylist System</div></div></div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showModule('overview')">📊 Overview</button>
    <button class="nav-btn" onclick="showModule('reps')">🏛️ House Reps</button>
    <button class="nav-btn" onclick="showModule('districts')">🗺️ Districts</button>
    <button class="nav-btn" onclick="showModule('dynasties')">👑 Dynasties</button>
    <button class="nav-btn" onclick="showModule('partylists')">🧾 Partylists</button>
    <button class="nav-btn" onclick="showModule('notes')">⚠️ Notes</button>
  </nav>
</header>
<main class="main"><div class="kpi-row" id="kpis"></div><div id="content"><div class="panel">Loading data…</div></div></main>
<div class="modal-overlay" id="modal" onclick="closeModal(event)"><div class="modal"><div class="modal-header"><div><div class="modal-name" id="modalName"></div><div class="modal-sub" id="modalSub"></div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<script>
let DB={reps:[],terms:[],districts:[],partylists:[],summary:[],congresses:[]};
let current='overview';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v||'').toLowerCase();
const latestCongress=()=>DB.congresses.at(-1)||'';
function setKpis(items){$('kpis').innerHTML=items.map(k=>`<div class="kpi" style="--accent:${k.accent}"><div class="kpi-label">${k.label}</div><div class="kpi-value">${esc(k.value)}</div><div class="kpi-sub">${esc(k.sub)}</div>${k.bar!=null?`<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.max(0,Math.min(100,k.bar))}%;background:${k.accent}"></div></div>`:''}</div>`).join('')}
function sortCongress(a,b){return parseInt(a)-parseInt(b)}
function countTermsIn(c){return DB.terms.filter(t=>t.congress===c)}
function surnameFreq(){const f={}; DB.districts.forEach(d=>d.history.forEach(h=>{if(h.surname)f[h.surname]=(f[h.surname]||0)+1})); return Object.entries(f).sort((a,b)=>b[1]-a[1])}
function top(list, key){return [...list].sort((a,b)=>(b[key]||0)-(a[key]||0))[0]}
function retention(){const c=latestCongress(); const prev=DB.congresses.at(-2); if(!c||!prev)return {kept:0,total:0,rate:0,changed:0}; let kept=0,total=0,changed=0; DB.districts.forEach(d=>{const now=d.history.find(h=>h.congress===c); const before=d.history.find(h=>h.congress===prev); if(now&&before){total++; if(now.rep_id===before.rep_id)kept++; else changed++;}}); return {kept,total,changed,rate:total?Math.round(kept/total*100):0,turnover:total?Math.round(changed/total*100):0}}
function showModule(m){current=m; document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['overview','reps','districts','dynasties','partylists','notes'][i]===m)); ({overview:renderOverview,reps:renderReps,districts:renderDistricts,dynasties:renderDynasties,partylists:renderPartylists,notes:renderNotes}[m])()}
async function init(){try{const r=await fetch('data/congress_database.json'); if(!r.ok) throw new Error('Missing JSON'); DB=await r.json(); showModule('overview')}catch(e){$('kpis').innerHTML=''; $('content').innerHTML='<div class="panel"><div class="panel-title">⚠️ Could not load data</div><p class="muted">Make sure <b>data/congress_database.json</b> exists. Run <b>node tools/convert-csv-to-json.js</b> after editing CSV files.</p></div>'; console.error(e)}}
function renderOverview(){const latest=latestCongress(), r=retention(); const aliasGroups=DB.partylists.filter(p=>p.aliases&&p.aliases.length).length; setKpis([{label:'House reps tracked',value:DB.reps.length,sub:'From source-house-representatives and source-house-terms',accent:'var(--gold)'},{label:'Partylists tracked',value:DB.partylists.length,sub:'Grouped by stable partylist_id',accent:'var(--green)'},{label:'Latest congress',value:latest||'—',sub:`${countTermsIn(latest).length} House term rows in latest cycle`,accent:'var(--blue)'},{label:'District retention',value:r.total?`${r.rate}%`:'—',sub:`${r.kept}/${r.total} districts kept the same rep`,accent:'var(--purple)',bar:r.rate}]); const topReps=[...DB.reps].sort((a,b)=>(b.term_count||0)-(a.term_count||0)).slice(0,5); const topParties=[...DB.partylists].sort((a,b)=>(b.total_seat_terms||0)-(a.total_seat_terms||0)).slice(0,5); $('content').innerHTML=`<div class="insight-row"><div class="insight-card"><div class="insight-title">🏛️ Longest-serving representatives</div>${barList(topReps,x=>x.name,x=>x.term_count,topReps[0]?.term_count||1,'var(--gold)')}</div><div class="insight-card"><div class="insight-title">🧾 Most consistent partylists</div>${barList(topParties,x=>x.name,x=>x.total_seat_terms,topParties[0]?.total_seat_terms||1,'var(--green)')}</div></div><div class="panel"><div class="panel-title">Simple data flow</div><p class="muted">Google Sheets CSV export links or local CSV files → <b>tools/convert-csv-to-json.js</b> → <b>data/congress_database.json</b> → this dashboard. Current alias/name-variation groups: <b>${aliasGroups}</b>.</p></div>`}
function barList(items,labelFn,valFn,max,color){return `<div class="bar-list">${items.map(x=>`<div class="bar-row"><div style="overflow:hidden;text-overflow:ellipsis">${esc(labelFn(x))}</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.round((valFn(x)||0)/max*100)}%;background:${color}"></div></div><div style="text-align:right;font:500 13px monospace;color:var(--text)">${esc(valFn(x))}</div></div>`).join('')||'<p class="muted">No data yet.</p>'}</div>`}
function renderReps(){const longest=top(DB.reps,'term_count'); const latest=latestCongress(); const returning=DB.reps.filter(r=>r.latest_congress===latest&&r.term_count>1).length; const avg=DB.reps.length?(DB.reps.reduce((s,r)=>s+(r.term_count||0),0)/DB.reps.length).toFixed(1):'0'; setKpis([{label:'Total reps tracked',value:DB.reps.length,sub:'Unique rep_id records',accent:'var(--gold)'},{label:'Longest-serving rep',value:longest?longest.term_count:'—',sub:longest?longest.name:'No data',accent:'var(--green)',bar:longest?Math.min(100,longest.term_count*20):0},{label:'Returning latest reps',value:returning,sub:`Served before and appear in ${latest||'latest congress'}`,accent:'var(--blue)'},{label:'Avg terms per rep',value:avg,sub:'Based on term rows, not manual KPI input',accent:'var(--purple)'}]); $('content').innerHTML=`<div class="panel"><div class="panel-title">🔍 Search House Representatives</div><div class="search-grid"><div class="field-group"><label class="field-label">Search</label><input class="search-input" id="repQ" oninput="drawReps()" placeholder="Name, district, clan, region"></div><div class="field-group"><label class="field-label">Congress</label><select class="search-select" id="repC" onchange="drawReps()"><option value="">All</option>${DB.congresses.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field-group"><label class="field-label">Filter</label><select class="search-select" id="repF" onchange="drawReps()"><option value="">All</option><option value="returning">Returning</option><option value="dynasty">Dynasty-tagged</option><option value="female">Female</option></select></div><button class="btn" onclick="$('repQ').value='';$('repC').value='';$('repF').value='';drawReps()">✕ Clear</button></div></div><div id="repCards"></div>`; drawReps()}
function drawReps(){const q=norm($('repQ').value),c=$('repC').value,f=$('repF').value; const rows=DB.reps.filter(r=>{const text=norm(`${r.name} ${r.surname} ${r.clan} ${r.latest_region} ${r.latest_district} ${r.terms.map(t=>`${t.province} ${t.district} ${t.congress}`).join(' ')}`); if(q&&!text.includes(q))return false; if(c&&!r.terms.some(t=>t.congress===c))return false; if(f==='returning'&&!(r.term_count>1))return false; if(f==='dynasty'&&!r.clan)return false; if(f==='female'&&r.sex!=='F')return false; return true}).sort((a,b)=>(b.term_count||0)-(a.term_count||0)||a.name.localeCompare(b.name)); $('repCards').innerHTML=`<div class="results-count">Showing <span>${rows.length}</span> representatives</div><div class="grid">${rows.map(r=>`<div class="card ${r.clan?'dynasty':''}" onclick="openRep('${esc(r.id)}')"><div class="card-name">${esc(r.name)}</div><div class="card-sub">${esc(r.latest_region)} · ${esc(r.latest_district||r.latest_seat_type)}</div><div class="tags"><span class="tag tag-blue">${esc(r.latest_congress||'No congress')}</span>${r.clan?`<span class="tag tag-gold">👑 ${esc(r.clan)}</span>`:''}${r.leadership?`<span class="tag tag-green">${esc(r.leadership)}</span>`:''}</div><div class="stats"><div><div class="stat-val">${r.term_count||0}</div><div class="stat-lbl">Terms</div></div><div style="font-size:11px;color:var(--text3)">First: ${esc(r.first_congress||'—')}<br>Latest: ${esc(r.latest_congress||'—')}</div></div></div>`).join('')}</div>`}
function renderDistricts(){const r=retention(); const sf=surnameFreq()[0]; const stable=DB.districts.filter(d=>d.is_stable).length; setKpis([{label:'Districts tracked',value:DB.districts.length,sub:'Unique province + district records',accent:'var(--gold)'},{label:'Stable districts',value:stable,sub:'Same rep across recorded congresses',accent:'var(--green)',bar:DB.districts.length?Math.round(stable/DB.districts.length*100):0},{label:'Latest turnover',value:r.total?`${r.turnover}%`:'—',sub:`${r.changed}/${r.total} districts changed from previous congress`,accent:'var(--red)',bar:r.turnover||0},{label:'Most repeated surname',value:sf?sf[0]:'—',sub:sf?`${sf[1]} district-seat appearances`:'No data',accent:'var(--blue)'}]); $('content').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Region</th><th>Province</th><th>District</th><th>History</th><th>Stable?</th></tr></thead><tbody>${DB.districts.map(d=>`<tr><td>${esc(d.region)}</td><td>${esc(d.province)}</td><td>${esc(d.district)}</td><td>${d.history.map(h=>`${esc(h.congress)}: ${esc(h.representative_name)}`).join('<br>')}</td><td>${d.is_stable?'Yes':'No / changing'}</td></tr>`).join('')}</tbody></table></div>`}
function renderDynasties(){const clans={}; DB.reps.filter(r=>r.clan).forEach(r=>{(clans[r.clan]=clans[r.clan]||[]).push(r)}); const clanRows=Object.entries(clans).sort((a,b)=>b[1].length-a[1].length); const terms=DB.reps.filter(r=>r.clan).reduce((s,r)=>s+(r.term_count||0),0); const all=DB.reps.reduce((s,r)=>s+(r.term_count||0),0); const recurring=surnameFreq().filter(x=>x[1]>=2); setKpis([{label:'Confirmed families',value:clanRows.length,sub:'From clan field in CSV',accent:'var(--gold)'},{label:'Dynasty-tagged terms',value:all?`${Math.round(terms/all*100)}%`:'—',sub:`${terms}/${all} term rows`,accent:'var(--red)',bar:all?Math.round(terms/all*100):0},{label:'Recurring surnames',value:recurring.length,sub:'Surnames appearing 2+ times in district history',accent:'var(--blue)'},{label:'Most repeated surname',value:recurring[0]?.[0]||'—',sub:recurring[0]?`${recurring[0][1]} appearances`:'No repeated surname yet',accent:'var(--purple)'}]); $('content').innerHTML=`<div class="insight-row"><div class="insight-card"><div class="insight-title">👑 Confirmed clans</div>${barList(clanRows,x=>x[0],x=>x[1].reduce((s,r)=>s+(r.term_count||0),0),Math.max(1,...clanRows.map(x=>x[1].reduce((s,r)=>s+(r.term_count||0),0))),'var(--gold)')}</div><div class="insight-card"><div class="insight-title">🔁 Recurring surnames</div>${barList(surnameFreq().slice(0,8),x=>x[0],x=>x[1],surnameFreq()[0]?.[1]||1,'var(--red)')}</div></div>`}
function renderPartylists(){const topSeats=[...DB.partylists].sort((a,b)=>(b.latest_seats||0)-(a.latest_seats||0))[0]; const consistent=top(DB.partylists,'total_seat_terms'); const aliases=DB.partylists.filter(p=>p.aliases.length).length; const oneTime=DB.partylists.filter(p=>p.one_time_winner).length; setKpis([{label:'Partylists tracked',value:DB.partylists.length,sub:'Unique partylist_id groups',accent:'var(--gold)'},{label:'Most consistent',value:consistent?consistent.name:'—',sub:consistent?`${consistent.total_seat_terms} total seat-terms`:'No data',accent:'var(--green)'},{label:'Latest seat leader',value:topSeats?topSeats.name:'—',sub:topSeats?`${topSeats.latest_seats} latest seats`:'No data',accent:'var(--blue)'},{label:'AKA/name groups',value:aliases,sub:'Partylists with aliases/name variants',accent:'var(--purple)',bar:DB.partylists.length?Math.round(aliases/DB.partylists.length*100):0}]); $('content').innerHTML=`<div class="panel"><div class="panel-title">🔍 Search Partylists</div><div class="search-grid"><div class="field-group"><label class="field-label">Search</label><input class="search-input" id="plQ" oninput="drawParties()" placeholder="Partylist, AKA, representative"></div><div class="field-group"><label class="field-label">Congress</label><select class="search-select" id="plC" onchange="drawParties()"><option value="">All</option>${DB.congresses.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field-group"><label class="field-label">Filter</label><select class="search-select" id="plF" onchange="drawParties()"><option value="">All</option><option value="with_seats">With seats</option><option value="flagged">With notes/issues</option><option value="aka">With AKA</option><option value="one_time">One-time winners</option></select></div><button class="btn" onclick="$('plQ').value='';$('plC').value='';$('plF').value='';drawParties()">✕ Clear</button></div></div><div id="partyCards"></div>`; drawParties()}
function drawParties(){const q=norm($('plQ').value),c=$('plC').value,f=$('plF').value; const rows=DB.partylists.filter(p=>{const text=norm(`${p.name} ${p.aliases.join(' ')} ${p.representatives.map(r=>r.name).join(' ')} ${p.notes.map(n=>n.title+' '+n.description).join(' ')}`); const h=c?p.history.find(x=>x.congress===c):p.history.at(-1); if(q&&!text.includes(q))return false; if(c&&!h)return false; if(f==='with_seats'&&!(Number(h?.seats_won)>0))return false; if(f==='flagged'&&!p.has_adverse_note)return false; if(f==='aka'&&!p.aliases.length)return false; if(f==='one_time'&&!p.one_time_winner)return false; return true}).sort((a,b)=>(b.latest_seats||0)-(a.latest_seats||0)||(b.total_seat_terms||0)-(a.total_seat_terms||0)); $('partyCards').innerHTML=`<div class="results-count">Showing <span>${rows.length}</span> partylists</div><div class="grid">${rows.map(p=>{const h=p.history.at(-1)||{}; return `<div class="card ${p.has_adverse_note?'flagged':''}" onclick="openParty('${esc(p.id)}')"><div class="card-name">${esc(p.name)}</div><div class="card-sub">${esc(p.aliases.join(' · ')||p.id)}</div><div class="tags"><span class="tag tag-green">${h.seats_won||0} latest seat${Number(h.seats_won)!==1?'s':''}</span>${p.aliases.length?`<span class="tag tag-gold">AKA ${p.aliases.length}</span>`:''}${p.has_adverse_note?'<span class="tag tag-red">⚠️ Notes</span>':''}</div><div class="stats"><div><div class="stat-val">${p.total_seat_terms||0}</div><div class="stat-lbl">Seat-Terms</div></div><div><div class="stat-val">${p.election_count||0}</div><div class="stat-lbl">Elections</div></div><div style="font-size:11px;color:var(--text3)">${esc(p.latest_congress||'—')}</div></div></div>`}).join('')}</div>`}
function renderNotes(){const notes=[]; DB.partylists.forEach(p=>p.notes.forEach(n=>notes.push({p,n}))); const aliases=DB.partylists.reduce((s,p)=>s+p.aliases.length,0); const legal=notes.filter(x=>/legal|case|registration|cancel|disqual/i.test(`${x.n.type} ${x.n.title} ${x.n.description}`)).length; setKpis([{label:'Total notes',value:notes.length,sub:'From source-partylist-notes.csv',accent:'var(--gold)'},{label:'Aliases tracked',value:aliases,sub:'AKA names from results rows',accent:'var(--purple)'},{label:'Legal/status flags',value:legal,sub:'Cancellation, case, registration, or disqualification text',accent:'var(--red)'},{label:'Flagged orgs',value:DB.partylists.filter(p=>p.has_adverse_note).length,sub:'Partylist records marked has_adverse_note',accent:'var(--blue)'}]); $('content').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Partylist</th><th>Date</th><th>Type</th><th>Title</th><th>Description</th><th>Source</th></tr></thead><tbody>${notes.map(({p,n})=>`<tr onclick="openParty('${esc(p.id)}')"><td>${esc(p.name)}</td><td>${esc(n.date||'—')}</td><td>${esc(n.type||'Note')}</td><td>${esc(n.title||'—')}</td><td>${esc(n.description||'—')}</td><td>${esc(n.source||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function openRep(id){const r=DB.reps.find(x=>x.id===id); if(!r)return; $('modalName').textContent=r.name; $('modalSub').textContent=[r.surname,r.clan].filter(Boolean).join(' · '); $('modalBody').innerHTML=`<div class="info-grid"><div class="info-item"><div class="info-lbl">Terms</div><div class="info-val">${r.term_count||0}</div></div><div class="info-item"><div class="info-lbl">Clan</div><div class="info-val">${esc(r.clan||'None')}</div></div><div class="info-item"><div class="info-lbl">Latest Congress</div><div class="info-val">${esc(r.latest_congress||'—')}</div></div><div class="info-item"><div class="info-lbl">Leadership</div><div class="info-val">${esc(r.leadership||'—')}</div></div></div><div class="section-head">📜 Term History</div>${r.terms.map(t=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-period">${esc(t.election_year)} · ${esc(t.congress)}</div><div class="tl-detail"><b>${esc(t.seat_type)}</b><br>${esc([t.region,t.province,t.district].filter(Boolean).join(' · '))}${t.leadership?`<br>${esc(t.leadership)}`:''}</div></div>`).join('')}`; openM()}
function openParty(id){const p=DB.partylists.find(x=>x.id===id); if(!p)return; $('modalName').textContent=p.name; $('modalSub').textContent=[p.id,p.aliases.join(' · ')].filter(Boolean).join(' · '); $('modalBody').innerHTML=`<div class="info-grid"><div class="info-item"><div class="info-lbl">Latest Seats</div><div class="info-val">${p.latest_seats}</div></div><div class="info-item"><div class="info-lbl">Total Seat-Terms</div><div class="info-val">${p.total_seat_terms}</div></div><div class="info-item"><div class="info-lbl">Elections</div><div class="info-val">${p.election_count}</div></div><div class="info-item"><div class="info-lbl">Aliases</div><div class="info-val">${p.aliases.length||'None'}</div></div></div><div class="section-head">📜 Seat History</div>${p.history.map(h=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-period">${esc(h.election_year)} · ${esc(h.congress)}</div><div class="tl-detail"><b>${esc(h.seats_won)} seat${Number(h.seats_won)!==1?'s':''}</b>${h.status?`<br>Status: ${esc(h.status)}`:''}${h.general_notes?`<br><span style="color:var(--text3)">${esc(h.general_notes)}</span>`:''}</div></div>`).join('')}<div class="section-head">👥 Representatives</div>${p.representatives.map(r=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-period">${esc(r.congress)}</div><div class="tl-detail"><b>${esc(r.name)}</b><br>Seat ${esc(r.seat_no||'—')}</div></div>`).join('')||'<p class="muted">No representatives listed.</p>'}<div class="section-head">⚠️ Notes</div>${p.notes.map(n=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-period">${esc(n.date||'—')}<br>${esc(n.type||'Note')}</div><div class="tl-detail"><b>${esc(n.title)}</b><br>${esc(n.description)}${n.source?`<br><span style="color:var(--text3)">Source: ${esc(n.source)}</span>`:''}</div></div>`).join('')||'<p class="muted">No notes listed.</p>'}`; openM()}
function openM(){$('modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(e){if(e&&e.target!==$('modal'))return;$('modal').classList.remove('open');document.body.style.overflow=''}
init();
</script>
</body>
