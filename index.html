<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PH Congress Database</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,300&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9922A;
  --gold-light:#F0C96A;
  --gold-dim:#8B6520;
  --gold-faint:rgba(201,146,42,0.08);
  --navy:#060D1A;
  --navy2:#0A1422;
  --surface:#0D1828;
  --surface2:#111F32;
  --surface3:#16283E;
  --surface4:#1B304A;
  --text:#E8EFF8;
  --text2:#9AADC4;
  --text3:#52697F;
  --red:#D95555;
  --red-bg:rgba(217,85,85,0.1);
  --green:#3BAA72;
  --green-bg:rgba(59,170,114,0.1);
  --blue:#4A9EE0;
  --blue-bg:rgba(74,158,224,0.1);
  --purple:#9B72CF;
  --purple-bg:rgba(155,114,207,0.1);
  --amber:#E09030;
  --amber-bg:rgba(224,144,48,0.1);
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.11);
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,0.5);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.7);
}

html{scroll-behavior:smooth}

body{
  font-family:'Outfit',sans-serif;
  background:var(--navy);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* Layered background */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 5% -10%, rgba(201,146,42,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 95% 90%, rgba(74,158,224,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(8,15,30,0.5) 0%, transparent 100%);
  pointer-events:none;
  z-index:0;
}

/* Subtle dot grid */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:28px 28px;
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
.header{
  background:rgba(6,13,26,0.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 32px;
  position:sticky;
  top:0;
  z-index:200;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:24px;
  height:62px;
}

/* Thin gold line at very top */
.header::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1.5px;
  background:linear-gradient(90deg, transparent 0%, var(--gold-dim) 25%, var(--gold) 50%, var(--gold-dim) 75%, transparent 100%);
  opacity:.6;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  text-decoration:none;
  flex-shrink:0;
}
.logo-badge{
  width:36px;
  height:36px;
  background:linear-gradient(135deg, var(--gold-dim) 0%, var(--gold) 60%, var(--gold-light) 100%);
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
  color:var(--navy);
  letter-spacing:-.5px;
  flex-shrink:0;
  box-shadow:0 2px 12px rgba(201,146,42,0.3);
}
.logo-name{
  font-family:'Fraunces',Georgia,serif;
  font-size:15px;
  font-weight:700;
  color:var(--gold-light);
  line-height:1.1;
  letter-spacing:-.2px;
}
.logo-sub{
  font-size:9.5px;
  color:var(--text3);
  letter-spacing:.9px;
  text-transform:uppercase;
  font-weight:400;
  margin-top:1px;
}

.nav{
  display:flex;
  gap:2px;
  justify-content:center;
}
.nav-btn{
  padding:6px 14px;
  border:1px solid transparent;
  background:transparent;
  color:var(--text3);
  font-family:'Outfit',sans-serif;
  font-size:12.5px;
  font-weight:500;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:.15s ease;
  white-space:nowrap;
  letter-spacing:.1px;
}
.nav-btn:hover{background:var(--surface3);color:var(--text2);border-color:var(--border)}
.nav-btn.active{
  background:var(--gold-faint);
  color:var(--gold-light);
  border-color:rgba(201,146,42,0.28);
}
.nav-icon{font-size:13px}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.data-badge{
  font-size:10.5px;
  padding:4px 10px;
  background:var(--green-bg);
  color:var(--green);
  border:1px solid rgba(59,170,114,0.2);
  border-radius:20px;
  font-weight:600;
  white-space:nowrap;
  letter-spacing:.2px;
}

/* ── LAYOUT ── */
.main{
  padding:28px 32px;
  max-width:1440px;
  margin:auto;
  position:relative;
  z-index:1;
}

/* ── KPI GRID ── */
.kpi-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:24px;
}
.kpi{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 22px;
  position:relative;
  overflow:hidden;
  transition:.2s ease;
}
.kpi:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi-accent-bar{
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:var(--accent,var(--gold));
  opacity:.65;
}
/* diagonal decorative corner */
.kpi::after{
  content:'';
  position:absolute;
  bottom:-18px;right:-18px;
  width:64px;height:64px;
  border-radius:50%;
  background:var(--accent,var(--gold));
  opacity:.04;
}
.kpi-label{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  color:var(--text3);
  font-weight:600;
  margin-bottom:9px;
}
.kpi-value{
  font-family:'Fraunces',Georgia,serif;
  font-size:28px;
  font-weight:700;
  line-height:1;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin-bottom:6px;
  letter-spacing:-.5px;
}
.kpi-sub{
  font-size:11px;
  color:var(--text3);
  line-height:1.5;
}
.kpi-bar{
  margin-top:14px;
  height:3px;
  background:rgba(255,255,255,0.05);
  border-radius:999px;
  overflow:hidden;
}
.kpi-bar-fill{
  height:100%;
  border-radius:999px;
  background:var(--accent,var(--gold));
  transition:width .7s ease;
}

/* ── PANEL ── */
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 24px;
  margin-bottom:16px;
}
.panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.panel-title{
  font-family:'Fraunces',Georgia,serif;
  font-size:14px;
  font-weight:600;
  color:var(--gold-light);
  display:flex;
  align-items:center;
  gap:8px;
}

/* ── FILTER BAR ── */
.filter-row{
  display:flex;
  gap:10px;
  align-items:flex-end;
  flex-wrap:wrap;
}
.field-group{
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
  min-width:140px;
}
.field-group.wide{flex:2.5}
.field-label{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:1.1px;
  color:var(--text3);
  font-weight:600;
}
.search-input,.search-select{
  background:var(--navy2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-family:'Outfit',sans-serif;
  font-size:13px;
  padding:8px 12px;
  outline:none;
  transition:.15s;
  width:100%;
}
.search-input:focus,.search-select:focus{border-color:var(--gold-dim);background:rgba(10,20,34,0.9)}
.search-input::placeholder{color:var(--text3)}
.search-select option{background:var(--navy2)}
.btn{
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text3);
  font-family:'Outfit',sans-serif;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:.15s;
  height:36px;
}
.btn:hover{border-color:var(--border2);color:var(--text2);background:var(--surface3)}

/* ── RESULTS ── */
.results-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  flex-wrap:wrap;
  gap:8px;
}
.results-count{
  font-size:12px;
  color:var(--text3);
}
.results-count strong{color:var(--text2);font-weight:600}

/* ── CARD GRID ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:12px;
}

/* ── REP CARD ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:17px 19px;
  cursor:pointer;
  transition:.2s ease;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:0;
}
.card:hover{
  border-color:rgba(201,146,42,0.35);
  background:var(--surface2);
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.card.dynasty-card{
  border-color:rgba(201,146,42,0.28);
  background:linear-gradient(135deg,var(--surface) 0%,rgba(42,28,6,0.55) 100%);
}
.card.flagged-card{
  border-color:rgba(217,85,85,0.28);
  background:linear-gradient(135deg,var(--surface) 0%,rgba(52,22,22,0.55) 100%);
}

.card-crown{
  position:absolute;
  top:11px;right:13px;
  font-size:13px;
  opacity:.65;
}

.card-initials{
  width:42px;height:42px;
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',Georgia,serif;
  font-size:17px;font-weight:700;
  flex-shrink:0;
  margin-bottom:11px;
}

.card-name{
  font-family:'Fraunces',Georgia,serif;
  font-size:16px;
  font-weight:700;
  color:var(--text);
  line-height:1.25;
  margin-bottom:3px;
  padding-right:22px;
  letter-spacing:-.2px;
}
.card-district{
  font-size:11px;
  color:var(--text3);
  font-family:'DM Mono',monospace;
  margin-bottom:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:13px;
}
.tag{
  font-size:10px;
  padding:2px 8px;
  border-radius:20px;
  font-weight:600;
  line-height:1.65;
  white-space:nowrap;
  letter-spacing:.1px;
}
.tag-blue{background:var(--blue-bg);color:#7BBFE4;border:1px solid rgba(74,158,224,0.16)}
.tag-gold{background:var(--amber-bg);color:var(--gold-light);border:1px solid rgba(201,146,42,0.22)}
.tag-green{background:var(--green-bg);color:#6ED69B;border:1px solid rgba(59,170,114,0.18)}
.tag-red{background:var(--red-bg);color:#EE9999;border:1px solid rgba(217,85,85,0.18)}
.tag-purple{background:var(--purple-bg);color:#C3A0E8;border:1px solid rgba(155,114,207,0.18)}

.card-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding-top:13px;
  border-top:1px solid var(--border);
  margin-top:auto;
}
.cs-item{text-align:center}
.cs-val{
  font-family:'DM Mono',monospace;
  font-size:16px;
  font-weight:500;
  color:var(--text);
  line-height:1;
  margin-bottom:3px;
}
.cs-lbl{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.9px;
  color:var(--text3);
}

/* ── TABLE ── */
.table-wrap{
  overflow:auto;
  border-radius:var(--radius);
  border:1px solid var(--border);
  margin-bottom:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
}
thead th{
  background:var(--surface2);
  color:var(--text3);
  padding:10px 14px;
  text-align:left;
  border-bottom:1px solid var(--border);
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.9px;
  white-space:nowrap;
  font-weight:600;
  position:sticky;
  top:0;
  z-index:2;
}
tbody td{
  padding:9px 14px;
  color:var(--text2);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
  vertical-align:middle;
}
tbody td:first-child{color:var(--text)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface3)}
.td-name{
  font-weight:500;
  font-size:13px;
}
.td-mono{
  font-family:'DM Mono',monospace;
  font-size:11.5px;
}

/* ── MODAL ── */
.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(3,7,16,0.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:fadeIn .15s ease;
}
.modal-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:20px;
  width:100%;
  max-width:600px;
  max-height:88vh;
  overflow-y:auto;
  box-shadow:var(--shadow-lg);
  animation:slideUp .2s ease;
  position:relative;
}
@keyframes slideUp{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}

.modal-close{
  position:sticky;
  top:0;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:10;
  border-radius:20px 20px 0 0;
}
.modal-close-btn{
  width:28px;height:28px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface3);
  color:var(--text2);
  cursor:pointer;
  font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.modal-close-btn:hover{background:var(--surface4);color:var(--text)}

.modal-body{padding:24px}
.modal-rep-header{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
}
.modal-initials{
  width:58px;height:58px;
  border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',Georgia,serif;
  font-size:23px;font-weight:700;
  flex-shrink:0;
}
.modal-rep-name{
  font-family:'Fraunces',Georgia,serif;
  font-size:22px;
  font-weight:700;
  line-height:1.2;
  color:var(--text);
  letter-spacing:-.3px;
}
.modal-rep-sub{
  font-size:11.5px;
  color:var(--text3);
  font-family:'DM Mono',monospace;
  margin-top:3px;
}

.modal-section{
  margin-bottom:20px;
}
.modal-section-label{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  color:var(--text3);
  font-weight:600;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.modal-section-label::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}

.term-row{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  background:var(--navy2);
  border-radius:8px;
  margin-bottom:6px;
}
.term-congress{
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:var(--gold-light);
  font-weight:500;
}
.term-district{
  font-size:12.5px;
  color:var(--text2);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.term-region{
  font-size:11px;
  color:var(--text3);
  white-space:nowrap;
}

.modal-stat-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:12px;
}
.modal-stat{
  background:var(--navy2);
  border-radius:10px;
  padding:12px 14px;
  text-align:center;
}
.modal-stat-val{
  font-family:'Fraunces',Georgia,serif;
  font-size:22px;
  font-weight:700;
  color:var(--text);
  line-height:1;
  margin-bottom:3px;
}
.modal-stat-lbl{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.9px;
  color:var(--text3);
}

/* ── DYNASTY ENTRIES ── */
.dynasty-entry{
  background:var(--navy2);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:8px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.dynasty-entry-name{
  font-size:13px;
  font-weight:600;
  color:var(--text);
  margin-bottom:2px;
}
.dynasty-entry-meta{
  font-size:11px;
  color:var(--text3);
  font-family:'DM Mono',monospace;
}
.dynasty-entry-congress{
  font-size:11px;
  color:var(--gold-light);
  font-family:'DM Mono',monospace;
  white-space:nowrap;
}

/* ── RANK BAR ── */
.rank-bar-wrap{
  margin-bottom:10px;
  background:var(--navy2);
  border-radius:10px;
  padding:12px 14px;
}
.rank-bar-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:7px;
}
.rank-bar-name{
  font-size:13px;
  font-weight:600;
  color:var(--text);
}
.rank-bar-count{
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:var(--text2);
}
.rank-bar{
  height:5px;
  background:rgba(255,255,255,0.05);
  border-radius:999px;
  overflow:hidden;
}
.rank-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold-dim),var(--gold));
  border-radius:999px;
}
.rank-bar-meta{
  font-size:11px;
  color:var(--text3);
  margin-top:5px;
}

/* ── PARTYLIST ── */
.pl-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:17px 19px;
  cursor:pointer;
  transition:.2s;
  position:relative;
}
.pl-card:hover{
  border-color:rgba(201,146,42,0.35);
  background:var(--surface2);
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.pl-card.flagged-card{
  border-color:rgba(217,85,85,0.28);
}
.pl-name{
  font-family:'Fraunces',Georgia,serif;
  font-size:16px;
  font-weight:700;
  color:var(--text);
  margin-bottom:4px;
  letter-spacing:-.2px;
}
.pl-alias{
  font-size:10.5px;
  color:var(--text3);
  font-family:'DM Mono',monospace;
  margin-bottom:10px;
}
.pl-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding-top:10px;
  border-top:1px solid var(--border);
}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;
  padding:52px 24px;
  color:var(--text3);
}
.empty-icon{font-size:36px;margin-bottom:12px}
.empty-text{font-size:14px;line-height:1.6}
.empty-sub{font-size:12px;margin-top:6px;font-family:'DM Mono',monospace;color:var(--text3);opacity:.55}

/* ── ERROR ── */
.error-panel{
  background:var(--red-bg);
  border:1px solid rgba(217,85,85,0.22);
  border-radius:var(--radius);
  padding:20px 24px;
  color:#EE9999;
  line-height:1.7;
  font-size:13.5px;
}
.error-panel strong{color:var(--red)}

/* ── NOTICE ── */
.notice{
  color:var(--text3);
  font-size:13px;
  line-height:1.75;
}
.notice code{
  font-family:'DM Mono',monospace;
  color:var(--gold-light);
  background:rgba(201,146,42,0.08);
  padding:1px 5px;
  border-radius:4px;
}

/* ── LOADING ── */
.loading{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:72px 24px;
  color:var(--text3);
  font-size:13px;
}
.spinner{
  width:18px;height:18px;
  border:2px solid var(--border2);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--surface3)}

/* ── RESPONSIVE ── */
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .header{grid-template-columns:auto 1fr;gap:12px;padding:0 16px;height:auto;padding-top:10px;padding-bottom:10px}
  .nav{grid-column:1/-1;overflow-x:auto;padding-bottom:2px}
  .header-right{display:none}
  .main{padding:16px}
}

  .kpi-row{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
  .filter-row{flex-direction:column}

}
@media(max-width:400px){.kpi-row{grid-template-columns:1fr}}

    <button class="nav-btn" onclick="showModule('partylists')"><span class="nav-icon">🧾</span> Partylists</button>

<!-- REP MODAL -->
<div class="modal-overlay" id="repModal" onclick="closeModal(event)">
  <div class="modal" id="repModalInner">
    <div class="modal-close">
      <div style="display:flex;align-items:center;gap:8px">
        <span id="modalTitleIcon" style="font-size:15px">🏛️</span>
        <span id="modalTitle" style="font-family:'Fraunces',Georgia,serif;font-size:14px;font-weight:600;color:var(--text2)">Representative Profile</span>
      </div>
      <button class="modal-close-btn" onclick="$('repModal').classList.remove('open');document.body.style.overflow=''">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>

<script>
const PATHS = {
  districts: "data/district-representatives.xlsx%20-%20reps.csv",
  overview: "data/roster-legislators-expanded.xlsx%20-%20overview.csv",
  partylist: "data/partylist.csv"
};

let DB = { terms:[], reps:[], districts:[], overview:[], partylists:[], partylistNotes:[] };

const $ = id => document.getElementById(id);

function clean(v){ return String(v ?? "").replace(/\uFEFF/g,"").replace(/\s+/g," ").trim(); }
function esc(v){ return String(v ?? "").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slug(v){ return clean(v).toLowerCase().replace(/["']/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function num(v){ const n=Number(String(v??"").replace(/,/g,"").trim()); return Number.isFinite(n)?n:0; }
function getSurname(name){ const n=clean(name); if(!n)return ""; if(n.includes(","))return clean(n.split(",")[0]); const p=n.split(" "); return p[p.length-1]||n; }

function getInitials(name){
  const n = clean(name);
  if(!n) return "?";
  const parts = n.replace(/,.*$/,"").split(" ").filter(Boolean);
  if(parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  return parts[0]?.[0]?.toUpperCase() || "?";
}

const COLOR_PALETTES = [
  ['#1A3A5C','#4A9EE0'],['#1A3C28','#3BAA72'],['#3A2A10','#C9922A'],
  ['#2A1A3C','#9B72CF'],['#3C1A1A','#D95555'],['#1A2E3C','#4AAED0'],
  ['#2A3C1A','#72C94A'],['#3C2A1A','#E09030']
];
function getColorPair(name){
  let h = 0;
  for(let i=0;i<name.length;i++) h = ((h<<5)-h) + name.charCodeAt(i);
  return COLOR_PALETTES[Math.abs(h) % COLOR_PALETTES.length];
}

function parseCSV(text){
  const rows=[]; let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'&&quoted&&n==='"'){cell+='"';i++;}
    else if(c==='"'){quoted=!quoted;}
    else if(c===','&&!quoted){row.push(cell);cell="";}
    else if((c==='\n'||c==='\r')&&!quoted){
      if(c==='\r'&&n==='\n')i++;
      row.push(cell);
      if(row.some(x=>clean(x)))rows.push(row);
      row=[];cell="";
    } else { cell+=c; }
  }
  row.push(cell); if(row.some(x=>clean(x)))rows.push(row);
  if(!rows.length)return [];
  const headers=rows[0].map(h=>clean(h));
  return rows.slice(1).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]??"");return o;});
}

async function fetchRequired(path){ const r=await fetch(path+"?v="+Date.now()); if(!r.ok)throw new Error("Could not load "+path); return await r.text(); }
async function fetchOptional(path){ try{ const r=await fetch(path+"?v="+Date.now()); if(!r.ok)return ""; return await r.text(); }catch(e){return "";} }

function congressNumber(congress){ return parseInt(String(congress).match(/\d+/)?.[0]||"0",10); }
function normalizeCongressName(name){ const n=clean(name); const m=n.match(/(\d+)(st|nd|rd|th)?\s*congress/i); if(!m)return n; return `${m[1]}${m[2]||"th"} Congress`; }
function congressToElectionYear(congress){ const n=congressNumber(congress); const map={20:2025,19:2022,18:2019,17:2016,16:2013,15:2010,14:2007,13:2004,12:2001,11:1998,10:1995,9:1992,8:1987}; return map[n]||""; }
function splitNames(cell){ const t=clean(cell); if(!t)return []; if(/^(n\/a|na|none|null|vacant|-|—)$/i.test(t))return []; return t.split(/\s*;\s*/).map(x=>clean(x)).filter(Boolean).filter(x=>!/^(n\/a|na|none|null|vacant|-|—)$/i.test(x)); }
function parseProvinceFromDistrict(district){ const d=clean(district); return d.includes(",")?clean(d.split(",")[0]):d; }

function convertWideDistrictCSV(rows){
  if(!rows.length)return [];
  const keys=Object.keys(rows[0]);
  const districtKey=keys.find(k=>clean(k).toLowerCase()==="district")||keys.find(k=>/district/i.test(k))||keys[1];
  const congressKeys=keys.filter(k=>/congress/i.test(k));
  const regionKey=keys.find(k=>k!==districtKey&&!/congress/i.test(k))||keys[0];
  const terms=[];
  rows.forEach(row=>{
    const region=clean(row[regionKey]),district=clean(row[districtKey]),province=parseProvinceFromDistrict(district);
    if(!region||!district)return;
    congressKeys.forEach(cKey=>{
      const congress=normalizeCongressName(cKey);
      splitNames(row[cKey]).forEach(name=>{
        terms.push({ rep_id:slug(name),full_name:name,surname:getSurname(name),region,province,district,district_id:slug(region+"-"+district),congress,congress_no:congressNumber(congress),election_year:congressToElectionYear(congress),seat_type:"District" });
      });
    });
  });
  return terms;
}

function buildReps(terms){
  const map=new Map();
  terms.forEach(t=>{ if(!map.has(t.rep_id))map.set(t.rep_id,{rep_id:t.rep_id,full_name:t.full_name,surname:t.surname,terms:[]}); map.get(t.rep_id).terms.push(t); });
  return Array.from(map.values()).map(r=>{ r.terms.sort((a,b)=>b.congress_no-a.congress_no); return r; });
}

function buildDistricts(terms){
  const map=new Map();
  terms.forEach(t=>{ if(!map.has(t.district_id))map.set(t.district_id,{district_id:t.district_id,region:t.region,province:t.province,district:t.district,terms:[]}); map.get(t.district_id).terms.push(t); });
  return Array.from(map.values()).map(d=>{ d.terms.sort((a,b)=>b.congress_no-a.congress_no); return d; });
}

function getRowValue(row,names){ const keys=Object.keys(row); for(const n of names){ const f=keys.find(k=>clean(k).toLowerCase()===clean(n).toLowerCase()); if(f&&clean(row[f]))return clean(row[f]); } return ""; }

function buildPartylistData(rows){
  if(!rows.length)return {partylists:[],notes:[]};
  const map=new Map(),notes=[];
  rows.forEach(row=>{
    const name=getRowValue(row,["partylist_name","main_name","name","partylist"])||"";
    const id=getRowValue(row,["partylist_id","id"])||slug(name);
    if(!id)return;
    if(!map.has(id))map.set(id,{partylist_id:id,name:name||id,aliases:new Set(),results:[],representatives:[],notes:[]});
    const p=map.get(id);
    const alias=getRowValue(row,["alias","aka","also_known_as","name_variation"]);
    if(alias)p.aliases.add(alias);
    const congress=getRowValue(row,["congress"]),electionYear=getRowValue(row,["election_year","year"]),seats=num(getRowValue(row,["seats_won","seats","latest_seats"]));
    if(congress||electionYear||seats)p.results.push({congress,election_year:electionYear,seats_won:seats,status:getRowValue(row,["status"]),general_notes:getRowValue(row,["general_notes","notes","remarks"])});
    const repName=getRowValue(row,["representative_name","nominee_name","representative","nominee"]);
    if(repName)p.representatives.push({congress,election_year:electionYear,seat_no:getRowValue(row,["seat_no","seat_number","nominee_no"]),representative_name:repName});
    const noteType=getRowValue(row,["note_type","type","category"]),noteTitle=getRowValue(row,["note_title","title"]),noteDesc=getRowValue(row,["note_description","description","details"]);
    if(noteType||noteTitle||noteDesc){ const note={partylist_id:id,partylist_name:name||id,date:getRowValue(row,["date","note_date"]),type:noteType,title:noteTitle,description:noteDesc}; p.notes.push(note);notes.push(note); }
  });
  const partylists=Array.from(map.values()).map(p=>{ p.aliases=Array.from(p.aliases); p.total_seat_terms=p.results.reduce((s,r)=>s+num(r.seats_won),0); p.latest_result=p.results.slice().sort((a,b)=>num(b.election_year)-num(a.election_year))[0]||null; p.has_adverse_note=p.notes.some(n=>/legal|case|cancel|disqual|registration|adverse|flag/i.test(`${n.type} ${n.title} ${n.description}`)); return p; });
  return {partylists,notes};
}

function allCongresses(){ const s=new Set(); DB.terms.forEach(t=>{if(t.congress)s.add(t.congress);}); DB.partylists.forEach(p=>{p.results.forEach(r=>{if(r.congress)s.add(r.congress);}); }); return Array.from(s).sort((a,b)=>congressNumber(a)-congressNumber(b)); }
function latestCongress(){ const l=allCongresses(); return l[l.length-1]||""; }
function latestElectionYear(){ const years=[...DB.terms.map(t=>num(t.election_year)),...DB.partylists.flatMap(p=>p.results.map(r=>num(r.election_year)))].filter(Boolean); return years.length?Math.max(...years):""; }

function setKpis(items){
  $("kpis").innerHTML=items.map(k=>`
    <div class="kpi" style="--accent:${k.accent}">
      <div class="kpi-accent-bar"></div>
      <div class="kpi-label">${esc(k.label)}</div>
      <div class="kpi-value">${esc(k.value)}</div>
      <div class="kpi-sub">${esc(k.sub)}</div>
      ${k.bar!=null?`<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${k.bar}%"></div></div>`:""}
    </div>
  `).join("");
}

function activateNav(module){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  const order=["reps","districts","dynasties","partylists","partyNotes"];
  const i=order.indexOf(module);
  if(i>=0) document.querySelectorAll(".nav-btn")[i].classList.add("active");
}

function showModule(module){
  activateNav(module);
  if(module==="reps") renderReps();
  if(module==="districts") renderDistricts();
  if(module==="dynasties") renderDynasties();
  if(module==="partylists") renderPartylists();
  if(module==="partyNotes") renderPartyNotes();
}

/* ── DYNASTY HELPERS ── */
function getSurnameMap(){
  const m={};
  DB.terms.forEach(t=>{ if(!t.surname)return; if(!m[t.surname])m[t.surname]=[]; m[t.surname].push(t); });
  return m;
}
function getDynastyStats(){
  const sm=getSurnameMap();
  const recurring=Object.entries(sm).filter(([s,t])=>t.length>=2).sort((a,b)=>b[1].length-a[1].length);
  const dynastyRepIds=new Set();
  recurring.forEach(([s,t])=>t.forEach(term=>dynastyRepIds.add(term.rep_id)));
  const dynastyDistricts=new Set();
  recurring.forEach(([s,t])=>t.forEach(term=>dynastyDistricts.add(term.district_id)));
  const districtCount={};
  recurring.forEach(([s,t])=>t.forEach(term=>{ districtCount[term.district]=(districtCount[term.district]||0)+1; }));
  const topDistrict=Object.entries(districtCount).sort((a,b)=>b[1]-a[1])[0]||["—",0];
  const dynastyTerms=recurring.reduce((s,[,t])=>s+t.length,0);
  const dynPct=DB.terms.length?Math.round(dynastyTerms/DB.terms.length*100):0;
  return { recurring, dynastyRepIds, dynastyDistricts, topDistrict, dynastyTerms, dynPct };
}

/* ── REPS MODULE ── */
function renderReps(){
  const latest=latestCongress();
  const latestTerms=DB.terms.filter(t=>t.congress===latest);

  // Most active region in latest congress
  const regionCount={};
  latestTerms.forEach(t=>{ regionCount[t.region]=(regionCount[t.region]||0)+1; });
  const topRegion=Object.entries(regionCount).sort((a,b)=>b[1]-a[1])[0]||["—",0];
  const totalLatest=latestTerms.length||1;

  // Seat turnover: seats in latest congress held by someone different from the previous congress
  const congresses=allCongresses();
  const prevCongress=congresses.length>=2?congresses[congresses.length-2]:"";
  let turnoverSeats=0,comparableSeats=0;
  if(prevCongress){
    const prevTerms=DB.terms.filter(t=>t.congress===prevCongress);
    const prevByDistrict=new Map();
    prevTerms.forEach(t=>prevByDistrict.set(t.district_id,t.rep_id));
    latestTerms.forEach(t=>{
      if(prevByDistrict.has(t.district_id)){
        comparableSeats++;
        if(prevByDistrict.get(t.district_id)!==t.rep_id) turnoverSeats++;
      }
    });
  }
  const turnoverPct=comparableSeats?Math.round(turnoverSeats/comparableSeats*100):0;

  const latestRepIds=new Set(latestTerms.map(t=>t.rep_id));
  const previousRepIds=new Set(DB.terms.filter(t=>t.congress!==latest).map(t=>t.rep_id));

  const topRep=DB.reps.slice().sort((a,b)=>b.terms.length-a.terms.length)[0];
  const maxTerms=topRep?topRep.terms.length:1;
  const multiTerm=DB.reps.filter(r=>r.terms.length>1).length;

  setKpis([
    {label:"Unique Representatives",value:DB.reps.length.toLocaleString(),sub:`Across all tracked congresses`,accent:"var(--gold)"},
    {label:"Longest-Serving Rep",value:topRep?topRep.surname:"—",sub:`${topRep?topRep.terms.length:0} congress appearances`,accent:"var(--blue)",bar:Math.round((topRep?topRep.terms.length:0)/maxTerms*100)},
    {label:"Multi-Term Reps",value:multiTerm.toLocaleString(),sub:`${DB.reps.length?Math.round(multiTerm/DB.reps.length*100):0}% of all tracked reps`,accent:"var(--green)",bar:DB.reps.length?Math.round(multiTerm/DB.reps.length*100):0},
    {label:"Seat Turnover Rate",value:turnoverPct+"%",sub:`${turnoverSeats} of ${comparableSeats} seats changed hands vs ${prevCongress||"prior congress"}`,accent:"var(--purple)",bar:turnoverPct}
  ]);

  $("content").innerHTML=`
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">🔍 Search Representatives</div>
      </div>
      <div class="filter-row">
        <div class="field-group wide">
          <label class="field-label">Search Name / District / Region</label>
          <input class="search-input" id="repQ" oninput="drawRepCards()" placeholder="e.g. Marcos, Leyte, Ilocos…">
        </div>
        <div class="field-group">
          <label class="field-label">Congress</label>
          <select class="search-select" id="repC" onchange="drawRepCards()">
            <option value="">All Congresses</option>
            ${allCongresses().map(c=>`<option>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Filter</label>
          <select class="search-select" id="repF" onchange="drawRepCards()">
            <option value="">All Representatives</option>
            <option value="returning">Returning / Multi-Term</option>
            <option value="single">Single-Term Only</option>
            <option value="latest">Latest Congress Only</option>
          </select>
        </div>
        <button class="btn" onclick="$('repQ').value='';$('repC').value='';$('repF').value='';drawRepCards()">✕ Clear</button>
      </div>
    </div>
    <div id="repCards"></div>
  `;
  drawRepCards();
}

function drawRepCards(){
  const q=clean($("repQ")?$("repQ").value:"").toLowerCase();
  const c=$("repC")?$("repC").value:"";
  const f=$("repF")?$("repF").value:"";
  const latest=latestCongress();

  const rows=DB.reps.filter(rep=>{
    const text=`${rep.full_name} ${rep.surname} ${rep.terms.map(t=>`${t.region} ${t.province} ${t.district} ${t.congress}`).join(" ")}`.toLowerCase();
    const hasCongress=!c||rep.terms.some(t=>t.congress===c);
    const isReturning=rep.terms.some(t=>t.congress===latest)&&rep.terms.some(t=>t.congress!==latest);
    const isSingle=rep.terms.length===1;
    const isLatest=rep.terms.some(t=>t.congress===latest);
    return (!q||text.includes(q))&&hasCongress&&
      (!f||(f==="returning"&&isReturning)||(f==="single"&&isSingle)||(f==="latest"&&isLatest));
  });

  $("repCards").innerHTML=`
    <div class="results-bar">
      <div class="results-count">Showing <strong>${rows.length.toLocaleString()}</strong> of ${DB.reps.length.toLocaleString()} representatives</div>
    </div>
    <div class="grid">
      ${rows.map(rep=>{
        const first=rep.terms.slice().sort((a,b)=>a.congress_no-b.congress_no)[0];
        const lt=rep.terms[0];
        const initials=getInitials(rep.full_name);
        const [bg,fg]=getColorPair(rep.surname||rep.full_name);
        const isMulti=rep.terms.length>1;
        return `<div class="card" onclick="openRepModal('${esc(rep.rep_id)}')">
          <div class="card-initials" style="background:${bg};color:${fg}">${initials}</div>
          <div class="card-name">${esc(rep.full_name)}</div>
          <div class="card-district">${esc(lt?lt.district:"—")}</div>
          <div class="tags">
            <span class="tag tag-blue">${esc(lt?lt.region:"—")}</span>
            ${isMulti?`<span class="tag tag-gold">⟳ Multi-Term</span>`:""}
          </div>
          <div class="card-stats">
            <div class="cs-item"><div class="cs-val">${rep.terms.length}</div><div class="cs-lbl">Terms</div></div>
            <div class="cs-item"><div class="cs-val">${esc(first?first.congress.replace(" Congress",""):"—")}</div><div class="cs-lbl">First</div></div>
            <div class="cs-item"><div class="cs-val">${esc(lt?lt.congress.replace(" Congress",""):"—")}</div><div class="cs-lbl">Latest</div></div>
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function openRepModal(repId){
  const rep=DB.reps.find(r=>r.rep_id===repId);
  if(!rep)return;
  const [bg,fg]=getColorPair(rep.surname||rep.full_name);
  const initials=getInitials(rep.full_name);
  const lt=rep.terms[0];
  const first=rep.terms.slice().sort((a,b)=>a.congress_no-b.congress_no)[0];
  const regions=[...new Set(rep.terms.map(t=>t.region))];
  const provinces=[...new Set(rep.terms.map(t=>t.province))];
  const latest=latestCongress();
  const isLatest=rep.terms.some(t=>t.congress===latest);

  $("modalTitle").textContent="Representative Profile";
  $("modalTitleIcon").textContent="🏛️";
  $("modalBody").innerHTML=`
    <div class="modal-rep-header">
      <div class="modal-initials" style="background:${bg};color:${fg}">${initials}</div>
      <div>
        <div class="modal-rep-name">${esc(rep.full_name)}</div>
        <div class="modal-rep-sub">${esc(lt?lt.district:"—")}</div>
        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px">
          ${isLatest?`<span class="tag tag-green">✓ Active ${esc(latest)}</span>`:""}
          ${rep.terms.length>1?`<span class="tag tag-gold">⟳ Multi-Term Rep</span>`:""}
          ${regions.map(r=>`<span class="tag tag-blue">${esc(r)}</span>`).join("")}
        </div>
      </div>
    </div>

    <div class="modal-stat-row">
      <div class="modal-stat"><div class="modal-stat-val">${rep.terms.length}</div><div class="modal-stat-lbl">Terms Served</div></div>
      <div class="modal-stat"><div class="modal-stat-val">${esc(first?first.congress_no+"th":"—")}</div><div class="modal-stat-lbl">First Congress</div></div>

/* ── DISTRICTS MODULE ── */
function renderDistricts(){
  const latest=latestCongress();
  const latestDistricts=DB.districts.filter(d=>d.terms.some(t=>t.congress===latest));
  const stable=DB.districts.filter(d=>{ const reps=new Set(d.terms.map(t=>t.rep_id)); return reps.size===1&&d.terms.length>1; }).length;
  const changed=latestDistricts.filter(d=>{ const lt=d.terms.find(t=>t.congress===latest); return d.terms.some(t=>t.congress!==latest&&t.rep_id!==(lt?lt.rep_id:"")); }).length;
  const turnover=latestDistricts.length?Math.round(changed/latestDistricts.length*100):0;
  const contested=DB.districts.filter(d=>{const reps=new Set(d.terms.map(t=>t.rep_id));return reps.size>2;}).length;

  setKpis([
    {label:"Districts Tracked",value:DB.districts.length.toLocaleString(),sub:"Unique legislative districts",accent:"var(--gold)"},
    {label:"Stable Districts",value:stable.toLocaleString(),sub:"Same rep across 2+ congresses",accent:"var(--green)",bar:DB.districts.length?Math.round(stable/DB.districts.length*100):0},
    {label:"Latest Turnover Rate",value:turnover+"%",sub:`Districts that changed rep in ${latest||"latest"}`,accent:"var(--red)",bar:turnover},
    {label:"Highly Contested",value:contested.toLocaleString(),sub:"3+ different reps over time",accent:"var(--purple)",bar:DB.districts.length?Math.round(contested/DB.districts.length*100):0}
  ]);

  const congresses=allCongresses().sort((a,b)=>congressNumber(b)-congressNumber(a));

  $("content").innerHTML=`
    <div class="panel">
      <div class="panel-header"><div class="panel-title">🗺️ District Representative History by Congress</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="min-width:110px">Region</th>
            <th style="min-width:200px">District</th>
            ${congresses.map(c=>`<th style="min-width:130px">${esc(c)}</th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${DB.districts.map(d=>`
            <tr>
              <td class="td-mono" style="color:var(--text3)">${esc(d.region)}</td>
              <td class="td-name">${esc(d.district)}</td>
              ${congresses.map(c=>{ const names=d.terms.filter(t=>t.congress===c).map(t=>t.full_name).join("; "); return `<td class="td-mono">${esc(names||"—")}</td>`; }).join("")}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ── DYNASTIES MODULE ── */
function renderDynasties(){
  const { recurring, dynastyRepIds, dynastyDistricts, topDistrict, dynastyTerms, dynPct } = getDynastyStats();
  const top=recurring[0]||["—",[]];
  const maxCount=top[1].length||1;

  setKpis([
    {label:"Recurring Surnames",value:recurring.length.toLocaleString(),sub:"Surnames appearing 2+ times (dynasty signal)",accent:"var(--gold)"},
    {label:"Most Frequent Surname",value:top[0],sub:`${top[1].length} tracked appearances in records`,accent:"var(--red)",bar:100},
    {label:"Dynasty Terms %",value:dynPct+"%",sub:`${dynastyTerms} of ${DB.terms.length} seat entries linked to recurring surnames`,accent:"var(--amber)",bar:dynPct},
    {label:"Largest Dynasty District",value:topDistrict[0].length>18?topDistrict[0].substring(0,18)+"…":topDistrict[0],sub:`${topDistrict[1]} seat entries with recurring surnames`,accent:"var(--purple)"}
  ]);

  $("content").innerHTML=`
    <div class="panel">
      <div class="panel-header"><div class="panel-title">👑 Dynasty Analysis — Recurring Surnames</div></div>
      <div class="notice" style="margin-bottom:0">
        Surname recurrence is used as a proxy signal. It does not confirm family relation.
        <strong style="color:var(--text2)">${dynastyRepIds.size}</strong> unique individuals and
        <strong style="color:var(--text2)">${dynastyDistricts.size}</strong> districts are linked to recurring surnames across all tracked congresses.
      </div>
    </div>
    <div class="grid">
      ${recurring.map(([surname,terms])=>{
        const districts=[...new Set(terms.map(t=>t.district))];
        const congresses=[...new Set(terms.map(t=>t.congress))];
        const reps=[...new Set(terms.map(t=>t.full_name))];
        return `
          <div class="card dynasty-card" onclick="openDynastyModal('${esc(surname)}')">
            <div class="card-crown">👑</div>
            <div class="card-name">${esc(surname)}</div>
            <div class="card-district">${reps.length} unique rep${reps.length!==1?'s':''} · ${districts.length} district${districts.length!==1?'s':''}</div>
            <div class="tags">
              <span class="tag tag-gold">${terms.length} appearances</span>
              <span class="tag tag-blue">${congresses.length} congress${congresses.length!==1?'es':''}</span>
            </div>
            <div class="rank-bar"><div class="rank-bar-fill" style="width:${Math.round(terms.length/maxCount*100)}%"></div></div>

/* ── PARTYLISTS MODULE ── */
function renderPartylists(){
  if(!DB.partylists.length){
    setKpis([
      {label:"Partylists Tracked",value:"—",sub:"Upload partylist.csv to activate",accent:"var(--gold)"},
      {label:"Election Cycles",value:"—",sub:"No data yet",accent:"var(--green)"},
      {label:"Total Seat-Terms",value:"—",sub:"No data yet",accent:"var(--blue)"},
      {label:"Flagged Partylists",value:"—",sub:"No data yet",accent:"var(--red)"}
    ]);
    $("content").innerHTML=`
      <div class="panel">
        <div class="panel-header"><div class="panel-title">🧾 Partylist Data Not Yet Uploaded</div></div>
        <div class="notice">
          Upload your CSV as <code>data/partylist.csv</code> to enable partylist analytics including seat history, election cycle trends, representative rosters, and name-change tracking.
        </div>
      </div>
    `;
    return;
  }

  const latestYear=latestElectionYear();
  const allResults=DB.partylists.flatMap(p=>p.results.map(r=>({...r,partylist_name:p.name})));
  const latestResults=allResults.filter(r=>num(r.election_year)===num(latestYear));
  const seatLeader=latestResults.slice().sort((a,b)=>num(b.seats_won)-num(a.seats_won))[0];
  const mostConsistent=DB.partylists.slice().sort((a,b)=>b.total_seat_terms-a.total_seat_terms)[0];
  const withAKA=DB.partylists.filter(p=>p.aliases.length>0).length;
  const flagged=DB.partylists.filter(p=>p.has_adverse_note).length;
  const totalSeats=DB.partylists.reduce((s,p)=>s+p.total_seat_terms,0);
  const electionCycles=[...new Set(allResults.map(r=>r.election_year).filter(Boolean))].length;

  setKpis([
    {label:"Partylists Tracked",value:DB.partylists.length.toLocaleString(),sub:`Across ${electionCycles} election cycle(s)`,accent:"var(--gold)"},
    {label:"Most Consistent Party",value:mostConsistent?mostConsistent.name:"—",sub:`${mostConsistent?mostConsistent.total_seat_terms:0} total seat-terms won`,accent:"var(--green)"},
    {label:"Latest Seat Leader",value:seatLeader?seatLeader.partylist_name:"—",sub:`${seatLeader?seatLeader.seats_won:0} seat(s) in ${latestYear}`,accent:"var(--blue)"},
    {label:"Flagged Partylists",value:flagged.toLocaleString(),sub:`${flagged} with legal/status notes · ${withAKA} with aliases`,accent:"var(--red)",bar:DB.partylists.length?Math.round(flagged/DB.partylists.length*100):0}

        <button class="btn" onclick="$('plQ').value='';drawPartylistCards()">✕ Clear</button>

    </div>
    <div id="partyCards"></div>
  `;
  drawPartylistCards();
}

function drawPartylistCards(){

  $("partyCards").innerHTML=`
    <div class="results-bar"><div class="results-count">Showing <strong>${rows.length}</strong> of ${DB.partylists.length} partylists</div></div>
    <div class="grid">
      ${rows.map(p=>`
        <div class="pl-card ${p.has_adverse_note?"flagged-card":""}" onclick="openPartyModal('${esc(p.partylist_id)}')">

          <div class="pl-alias">${esc(p.aliases.join(" · ")||p.partylist_id)}</div>

}

/* ── INIT ── */
async function init(){
  try{
    const districtCSV=await fetchRequired(PATHS.districts);
    const overviewCSV=await fetchOptional(PATHS.overview);
    const partylistCSV=await fetchOptional(PATHS.partylist);
    const districtRows=parseCSV(districtCSV);
    const overviewRows=overviewCSV?parseCSV(overviewCSV):[];
    const partylistRows=partylistCSV?parseCSV(partylistCSV):[];
    const terms=convertWideDistrictCSV(districtRows);
    const reps=buildReps(terms);
    const districts=buildDistricts(terms);
    const partyData=buildPartylistData(partylistRows);
    DB={terms,reps,districts,overview:overviewRows,partylists:partyData.partylists,partylistNotes:partyData.notes};
    if(!terms.length) throw new Error("The district CSV loaded, but no Congress data was detected. Check that your columns include 20th Congress, 19th Congress, 18th Congress, etc.");
    $("headerBadge").textContent=`${reps.length.toLocaleString()} Reps · ${districts.length} Districts`;
    showModule("reps");
  }catch(err){
    console.error(err);
    $("kpis").innerHTML="";
    $("headerBadge").textContent="Error loading data";
    $("headerBadge").style.background="var(--red-bg)";
    $("headerBadge").style.color="var(--red)";
    $("content").innerHTML=`
      <div class="error-panel">
        <strong>Database loading failed.</strong><br><br>
        ${esc(err.message)}<br><br>
        Looking for:<br>
        <code style="font-family:'DM Mono',monospace;color:var(--gold-light)">${esc(PATHS.districts)}</code><br>
        <code style="font-family:'DM Mono',monospace;color:var(--text3)">${esc(PATHS.overview)}</code>
      </div>
    `;
  }
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape"){$("repModal").classList.remove("open");document.body.style.overflow="";} });

init();
</script>
