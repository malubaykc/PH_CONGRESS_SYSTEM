<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PH Congress Database</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9922A;
  --gold-light:#F0C96A;
  --gold-dim:#8B6520;
  --navy:#0A1628;
  --navy2:#112240;
  --surface:#0F1F38;
  --surface2:#162848;
  --surface3:#1E3254;
  --text:#E8EDF5;
  --text2:#A8B8CC;
  --text3:#6A82A0;
  --red:#E05252;
  --green:#3CB07A;
  --blue:#4A9EE0;
  --purple:#9B72CF;
  --border:#1E3254;
  --radius:12px;
  --warn-bg:#2A1A08;
  --warn-border:#8B6520;
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  color:var(--text);
  min-height:100vh;
}
.header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#0D1F3C 100%);
  border-bottom:1px solid var(--gold-dim);
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:64px;
  gap:16px;
}
.logo{display:flex;gap:12px;align-items:center}
.logo-flag{font-size:28px;font-weight:800}
.logo-text{
  font-family:'Playfair Display',Georgia,serif;
  font-size:18px;
  font-weight:700;
  color:var(--gold-light);
}
.logo-sub{
  font-size:11px;
  color:var(--text3);
  letter-spacing:.5px;
  text-transform:uppercase;
}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav-btn{
  padding:7px 13px;
  border:0;
  background:transparent;
  color:var(--text2);
  font:500 13px sans-serif;
  border-radius:8px;
  cursor:pointer;
}
.nav-btn:hover,.nav-btn.active{
  background:var(--surface3);
  color:var(--gold-light);
}
.main{
  padding:24px 28px;
  max-width:1400px;
  margin:auto;
}
.kpi-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:24px;
}
.kpi{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
  position:relative;
  overflow:hidden;
}
.kpi:before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:var(--accent,var(--gold));
}
.kpi-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--text3);
  font-weight:500;
  margin-bottom:6px;
}
.kpi-value{
  font-family:'Playfair Display',Georgia,serif;
  font-size:28px;
  font-weight:700;
  line-height:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.kpi-sub{
  font-size:12px;
  color:var(--text3);
  margin-top:5px;
}
.kpi-bar{
  margin-top:10px;
  height:6px;
  background:var(--navy2);
  border-radius:999px;
  overflow:hidden;
}
.kpi-bar-fill{
  height:100%;
  background:var(--accent,var(--gold));
  border-radius:999px;
}
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 24px;
  margin-bottom:20px;
}
.panel-title{
  font-family:'Playfair Display',Georgia,serif;
  font-size:15px;
  color:var(--gold-light);
  margin-bottom:14px;
}
.search-grid{
  display:grid;
  grid-template-columns:2fr 1.2fr 1.2fr 1fr;
  gap:10px;
  align-items:end;
}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:var(--text3);
}
.search-input,.search-select{
  background:var(--navy2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  padding:9px 12px;
  outline:none;
}
.btn{
  padding:9px 16px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text3);
  font-weight:600;
  cursor:pointer;
}
.btn:hover{border-color:var(--text3);color:var(--text)}
.results-count{
  font-size:13px;
  color:var(--text3);
  margin-bottom:12px;
}
.results-count span{
  color:var(--gold-light);
  font-weight:600;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:14px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  transition:.2s;
  position:relative;
  overflow:hidden;
}
.card:hover{
  border-color:var(--gold-dim);
  transform:translateY(-2px);
  box-shadow:0 6px 28px rgba(0,0,0,.3);
}
.card.dynasty{
  border-color:var(--warn-border);
  background:var(--warn-bg);
}
.card.flagged{
  border-color:#704040;
  background:#341919;
}
.card.dynasty:after{
  content:'👑';
  position:absolute;
  right:12px;
  top:12px;
}
.card.flagged:after{
  content:'⚠️';
  position:absolute;
  right:12px;
  top:12px;
}
.card-name{
  font-family:'Playfair Display',Georgia,serif;
  font-size:17px;
  font-weight:700;
  margin-bottom:4px;
  padding-right:26px;
}
.card-sub{
  font:12px monospace;
  color:var(--text3);
  margin-bottom:9px;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:10px;
}
.tag{
  font-size:11px;
  padding:3px 8px;
  border-radius:20px;
  font-weight:500;
}
.tag-blue{background:#1E2F48;color:#7BADD4}
.tag-gold{background:#2A1F00;color:var(--gold-light);border:1px solid var(--gold-dim)}
.tag-green{background:#1A3520;color:#5ECC7B;border:1px solid #2E6040}
.tag-red{background:#341919;color:#FF9999;border:1px solid #704040}
.stats{
  display:flex;
  gap:14px;
  margin-top:9px;
  padding-top:9px;
  border-top:1px solid var(--border);
}
.stat-val{
  font:500 17px monospace;
  color:var(--text);
}
.stat-lbl{
  font-size:10px;
  color:var(--text3);
  text-transform:uppercase;
}
.table-wrap{
  overflow:auto;
  border-radius:var(--radius);
  border:1px solid var(--border);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
thead th{
  background:var(--surface2);
  color:var(--text2);
  padding:11px 13px;
  text-align:left;
  border-bottom:1px solid var(--border);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  white-space:nowrap;
}
tbody td{
  padding:9px 13px;
  color:var(--text2);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody tr:hover{background:var(--surface2)}
.error{
  background:#341919;
  border:1px solid #704040;
  color:#FF9999;
  padding:18px;
  border-radius:12px;
  line-height:1.6;
}
.notice{
  color:var(--text3);
  font-size:14px;
  line-height:1.6;
}
code{
  color:var(--gold-light);
}
.loading{
  color:var(--text3);
  padding:30px;
  text-align:center;
}
@media(max-width:900px){
  .kpi-row{grid-template-columns:1fr 1fr}
  .search-grid{grid-template-columns:1fr 1fr}
  .header{flex-direction:column;align-items:flex-start;padding:12px 16px}
  .main{padding:16px}
}
@media(max-width:600px){
  .kpi-row,.search-grid{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header class="header">
  <div class="logo">
    <span class="logo-flag">PH</span>
    <div>
      <div class="logo-text">PH Congress Database</div>
      <div class="logo-sub">District Representatives + Partylist System</div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="showModule('reps')">🏛️ House Reps</button>
    <button class="nav-btn" onclick="showModule('districts')">🗺️ Districts</button>
    <button class="nav-btn" onclick="showModule('dynasties')">👑 Dynasties</button>
    <button class="nav-btn" onclick="showModule('partylists')">🧾 Partylists</button>
    <button class="nav-btn" onclick="showModule('partyNotes')">⚠️ Partylist Notes</button>
  </nav>
</header>

<main class="main">
  <div class="kpi-row" id="kpis"></div>
  <div id="content" class="loading">Loading database...</div>
</main>

<script>
const PATHS = {
  districts: "data/district-representatives.xlsx%20-%20reps.csv",
  overview: "data/roster-legislators-expanded.xlsx%20-%20overview.csv",
  partylist: "data/partylist.csv"
};

let DB = {
  terms: [],
  reps: [],
  districts: [],
  overview: [],
  partylists: [],
  partylistNotes: []
};

const $ = id => document.getElementById(id);

function clean(v){
  return String(v ?? "").replace(/\uFEFF/g,"").replace(/\s+/g," ").trim();
}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function slug(v){
  return clean(v)
    .toLowerCase()
    .replace(/["']/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function num(v){
  const n = Number(String(v ?? "").replace(/,/g,"").trim());
  return Number.isFinite(n) ? n : 0;
}

function getSurname(name){
  const n = clean(name);
  if(!n) return "";
  if(n.includes(",")) return clean(n.split(",")[0]);
  const parts = n.split(" ");
  return parts[parts.length - 1] || n;
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(char === '"' && quoted && next === '"'){
      cell += '"';
      i++;
    } else if(char === '"'){
      quoted = !quoted;
    } else if(char === "," && !quoted){
      row.push(cell);
      cell = "";
    } else if((char === "\n" || char === "\r") && !quoted){
      if(char === "\r" && next === "\n") i++;
      row.push(cell);
      if(row.some(x => clean(x))) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += char;
    }
  }

  row.push(cell);
  if(row.some(x => clean(x))) rows.push(row);

  if(!rows.length) return [];

  const headers = rows[0].map(h => clean(h));

  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ?? "");
    return obj;
  });
}

async function fetchRequired(path){
  const res = await fetch(path + "?v=" + Date.now());
  if(!res.ok) throw new Error("Could not load " + path);
  return await res.text();
}

async function fetchOptional(path){
  try{
    const res = await fetch(path + "?v=" + Date.now());
    if(!res.ok) return "";
    return await res.text();
  }catch(e){
    return "";
  }
}

function congressNumber(congress){
  return parseInt(String(congress).match(/\d+/)?.[0] || "0", 10);
}

function normalizeCongressName(name){
  const n = clean(name);
  const match = n.match(/(\d+)(st|nd|rd|th)?\s*congress/i);
  if(!match) return n;
  return `${match[1]}${match[2] || "th"} Congress`;
}

function congressToElectionYear(congress){
  const n = congressNumber(congress);
  const map = {
    20:2025,
    19:2022,
    18:2019,
    17:2016,
    16:2013,
    15:2010,
    14:2007,
    13:2004,
    12:2001,
    11:1998,
    10:1995,
    9:1992,
    8:1987
  };
  return map[n] || "";
}

function splitNames(cell){
  const text = clean(cell);
  if(!text) return [];
  if(/^(n\/a|na|none|null|vacant|-|—)$/i.test(text)) return [];

  return text
    .split(/\s*;\s*/)
    .map(x => clean(x))
    .filter(Boolean)
    .filter(x => !/^(n\/a|na|none|null|vacant|-|—)$/i.test(x));
}

function parseProvinceFromDistrict(district){
  const d = clean(district);
  return d.includes(",") ? clean(d.split(",")[0]) : d;
}

function convertWideDistrictCSV(rows){
  if(!rows.length) return [];

  const keys = Object.keys(rows[0]);

  const districtKey =
    keys.find(k => clean(k).toLowerCase() === "district") ||
    keys.find(k => /district/i.test(k)) ||
    keys[1];

  const congressKeys = keys.filter(k => /congress/i.test(k));

  const regionKey =
    keys.find(k => k !== districtKey && !/congress/i.test(k)) ||
    keys[0];

  const terms = [];

  rows.forEach(row => {
    const region = clean(row[regionKey]);
    const district = clean(row[districtKey]);
    const province = parseProvinceFromDistrict(district);

    if(!region || !district) return;

    congressKeys.forEach(cKey => {
      const congress = normalizeCongressName(cKey);
      const names = splitNames(row[cKey]);

      names.forEach(name => {
        terms.push({
          rep_id: slug(name),
          full_name: name,
          surname: getSurname(name),
          region,
          province,
          district,
          district_id: slug(region + "-" + district),
          congress,
          congress_no: congressNumber(congress),
          election_year: congressToElectionYear(congress),
          seat_type: "District"
        });
      });
    });
  });

  return terms;
}

function buildReps(terms){
  const map = new Map();

  terms.forEach(t => {
    if(!map.has(t.rep_id)){
      map.set(t.rep_id, {
        rep_id:t.rep_id,
        full_name:t.full_name,
        surname:t.surname,
        terms:[]
      });
    }

    map.get(t.rep_id).terms.push(t);
  });

  return Array.from(map.values()).map(rep => {
    rep.terms.sort((a,b) => b.congress_no - a.congress_no);
    return rep;
  });
}

function buildDistricts(terms){
  const map = new Map();

  terms.forEach(t => {
    if(!map.has(t.district_id)){
      map.set(t.district_id, {
        district_id:t.district_id,
        region:t.region,
        province:t.province,
        district:t.district,
        terms:[]
      });
    }

    map.get(t.district_id).terms.push(t);
  });

  return Array.from(map.values()).map(d => {
    d.terms.sort((a,b) => b.congress_no - a.congress_no);
    return d;
  });
}

function getRowValue(row, possibleNames){
  const keys = Object.keys(row);

  for(const name of possibleNames){
    const found = keys.find(k => clean(k).toLowerCase() === clean(name).toLowerCase());
    if(found && clean(row[found])) return clean(row[found]);
  }

  return "";
}

function buildPartylistData(rows){
  if(!rows.length) return { partylists: [], notes: [] };

  const map = new Map();
  const notes = [];

  rows.forEach(row => {
    const name =
      getRowValue(row, ["partylist_name","main_name","name","partylist"]) ||
      "";

    const id =
      getRowValue(row, ["partylist_id","id"]) ||
      slug(name);

    if(!id) return;

    if(!map.has(id)){
      map.set(id, {
        partylist_id:id,
        name:name || id,
        aliases:new Set(),
        results:[],
        representatives:[],
        notes:[]
      });
    }

    const p = map.get(id);

    const alias = getRowValue(row, ["alias","aka","also_known_as","name_variation"]);
    if(alias) p.aliases.add(alias);

    const congress = getRowValue(row, ["congress"]);
    const electionYear = getRowValue(row, ["election_year","year"]);
    const seats = num(getRowValue(row, ["seats_won","seats","latest_seats"]));

    if(congress || electionYear || seats){
      p.results.push({
        congress,
        election_year:electionYear,
        seats_won:seats,
        status:getRowValue(row, ["status"]),
        general_notes:getRowValue(row, ["general_notes","notes","remarks"])
      });
    }

    const repName = getRowValue(row, ["representative_name","nominee_name","representative","nominee"]);
    if(repName){
      p.representatives.push({
        congress,
        election_year:electionYear,
        seat_no:getRowValue(row, ["seat_no","seat_number","nominee_no"]),
        representative_name:repName
      });
    }

    const noteType = getRowValue(row, ["note_type","type","category"]);
    const noteTitle = getRowValue(row, ["note_title","title"]);
    const noteDesc = getRowValue(row, ["note_description","description","details"]);

    if(noteType || noteTitle || noteDesc){
      const note = {
        partylist_id:id,
        partylist_name:name || id,
        date:getRowValue(row, ["date","note_date"]),
        type:noteType,
        title:noteTitle,
        description:noteDesc
      };

      p.notes.push(note);
      notes.push(note);
    }
  });

  const partylists = Array.from(map.values()).map(p => {
    p.aliases = Array.from(p.aliases);
    p.total_seat_terms = p.results.reduce((s,r) => s + num(r.seats_won), 0);
    p.latest_result = p.results.slice().sort((a,b) => num(b.election_year) - num(a.election_year))[0] || null;
    p.has_adverse_note = p.notes.some(n =>
      /legal|case|cancel|disqual|registration|adverse|flag/i.test(`${n.type} ${n.title} ${n.description}`)
    );
    return p;
  });

  return { partylists, notes };
}

function allCongresses(){
  const set = new Set();

  DB.terms.forEach(t => {
    if(t.congress) set.add(t.congress);
  });

  DB.partylists.forEach(p => {
    p.results.forEach(r => {
      if(r.congress) set.add(r.congress);
    });
  });

  return Array.from(set).sort((a,b) => congressNumber(a) - congressNumber(b));
}

function latestCongress(){
  const list = allCongresses();
  return list[list.length - 1] || "";
}

function latestElectionYear(){
  const years = [
    ...DB.terms.map(t => num(t.election_year)),
    ...DB.partylists.flatMap(p => p.results.map(r => num(r.election_year)))
  ].filter(Boolean);

  return years.length ? Math.max(...years) : "";
}

function setKpis(items){
  $("kpis").innerHTML = items.map(k => `
    <div class="kpi" style="--accent:${k.accent}">
      <div class="kpi-label">${esc(k.label)}</div>
      <div class="kpi-value">${esc(k.value)}</div>
      <div class="kpi-sub">${esc(k.sub)}</div>
      ${k.bar != null ? `
        <div class="kpi-bar">
          <div class="kpi-bar-fill" style="width:${k.bar}%;background:${k.accent}"></div>
        </div>
      ` : ""}
    </div>
  `).join("");
}

function activateNav(module){
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  const order = ["reps","districts","dynasties","partylists","partyNotes"];
  const index = order.indexOf(module);

  if(index >= 0){
    document.querySelectorAll(".nav-btn")[index].classList.add("active");
  }
}

function showModule(module){
  activateNav(module);

  if(module === "reps") renderReps();
  if(module === "districts") renderDistricts();
  if(module === "dynasties") renderDynasties();
  if(module === "partylists") renderPartylists();
  if(module === "partyNotes") renderPartyNotes();
}

function getTopSurname(){
  const freq = {};

  DB.terms.forEach(t => {
    if(t.surname) freq[t.surname] = (freq[t.surname] || 0) + 1;
  });

  return Object.entries(freq).sort((a,b) => b[1] - a[1])[0] || ["—",0];
}

function renderReps(){
  const latest = latestCongress();
  const latestTerms = DB.terms.filter(t => t.congress === latest);
  const topRep = DB.reps.slice().sort((a,b) => b.terms.length - a.terms.length)[0];

  const returning = latestTerms.filter(t =>
    DB.terms.some(x => x.rep_id === t.rep_id && x.congress !== latest)
  ).length;

  const retention = latestTerms.length ? Math.round((returning / latestTerms.length) * 100) : 0;

  setKpis([
    {
      label:"Total reps tracked",
      value:DB.reps.length,
      sub:"Unique district representatives",
      accent:"var(--gold)"
    },
    {
      label:"Longest-serving rep",
      value:topRep ? topRep.surname : "—",
      sub:`${topRep ? topRep.terms.length : 0} tracked congress appearance(s)`,
      accent:"var(--blue)",
      bar:Math.min((topRep ? topRep.terms.length : 0) * 10,100)
    },
    {
      label:"Returning latest reps",
      value:returning,
      sub:`Returned in ${latest || "latest congress"}`,
      accent:"var(--green)",
      bar:retention
    },
    {
      label:"Latest retention rate",
      value:retention + "%",
      sub:"Latest reps with prior tracked terms",
      accent:"var(--purple)",
      bar:retention
    }
  ]);

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">🔍 Search & Filter House Representatives</div>

      <div class="search-grid">
        <div class="field-group">
          <label class="field-label">Search Name / District / Region</label>
          <input class="search-input" id="repQ" oninput="drawRepCards()" placeholder="e.g. Marcos, Leyte, Manila">
        </div>

        <div class="field-group">
          <label class="field-label">Congress</label>
          <select class="search-select" id="repC" onchange="drawRepCards()">
            <option value="">All Congresses</option>
            ${allCongresses().map(c => `<option>${esc(c)}</option>`).join("")}
          </select>
        </div>

        <div class="field-group">
          <label class="field-label">Filter</label>
          <select class="search-select" id="repF" onchange="drawRepCards()">
            <option value="">All</option>
            <option value="returning">Returning Latest Reps</option>
            <option value="multi">Multi-Term Reps</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label">&nbsp;</label>
          <button class="btn" onclick="document.getElementById('repQ').value='';document.getElementById('repC').value='';document.getElementById('repF').value='';drawRepCards()">✕ Clear</button>
        </div>
      </div>
    </div>

    <div id="repCards"></div>
  `;

  drawRepCards();
}

function drawRepCards(){
  const q = clean($("repQ") ? $("repQ").value : "").toLowerCase();
  const c = $("repC") ? $("repC").value : "";
  const f = $("repF") ? $("repF").value : "";
  const latest = latestCongress();

  const rows = DB.reps.filter(rep => {
    const text = `${rep.full_name} ${rep.surname} ${rep.terms.map(t => `${t.region} ${t.province} ${t.district} ${t.congress}`).join(" ")}`.toLowerCase();

    const hasCongress = !c || rep.terms.some(t => t.congress === c);
    const isReturning = rep.terms.some(t => t.congress === latest) && rep.terms.some(t => t.congress !== latest);
    const isMulti = rep.terms.length > 1;

    return (!q || text.includes(q)) &&
      hasCongress &&
      (!f || (f === "returning" && isReturning) || (f === "multi" && isMulti));
  });

  $("repCards").innerHTML = `
    <div class="results-count">Showing <span>${rows.length}</span> representatives</div>

    <div class="grid">
      ${rows.map(rep => {
        const first = rep.terms.slice().sort((a,b) => a.congress_no - b.congress_no)[0];
        const latestTerm = rep.terms[0];

        return `
          <div class="card">
            <div class="card-name">${esc(rep.full_name)}</div>
            <div class="card-sub">${esc(latestTerm ? latestTerm.district : "")}</div>

            <div class="tags">
              <span class="tag tag-blue">${esc(latestTerm ? latestTerm.region : "—")}</span>
              ${rep.terms.length > 1 ? `<span class="tag tag-gold">Returning / Multi-Term</span>` : ""}
            </div>

            <div class="stats">
              <div>
                <div class="stat-val">${rep.terms.length}</div>
                <div class="stat-lbl">Terms</div>
              </div>

              <div style="flex:1;font-size:11px;color:var(--text3)">
                First: ${esc(first ? first.congress : "—")}<br>
                Latest: ${esc(latestTerm ? latestTerm.congress : "—")}
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderDistricts(){
  const latest = latestCongress();

  const stable = DB.districts.filter(d => {
    const reps = new Set(d.terms.map(t => t.rep_id));
    return reps.size === 1 && d.terms.length > 1;
  }).length;

  const latestDistricts = DB.districts.filter(d =>
    d.terms.some(t => t.congress === latest)
  );

  const changed = latestDistricts.filter(d => {
    const latestTerm = d.terms.find(t => t.congress === latest);
    return d.terms.some(t => t.congress !== latest && t.rep_id !== (latestTerm ? latestTerm.rep_id : ""));
  }).length;

  const turnover = latestDistricts.length ? Math.round((changed / latestDistricts.length) * 100) : 0;
  const topSurname = getTopSurname();

  setKpis([
    {
      label:"Districts tracked",
      value:DB.districts.length,
      sub:"Unique district records",
      accent:"var(--gold)"
    },
    {
      label:"Stable districts",
      value:stable,
      sub:"Same rep across multiple congresses",
      accent:"var(--green)",
      bar:DB.districts.length ? Math.round(stable / DB.districts.length * 100) : 0
    },
    {
      label:"Latest turnover rate",
      value:turnover + "%",
      sub:`Changed holder in ${latest || "latest congress"}`,
      accent:"var(--red)",
      bar:turnover
    },
    {
      label:"Most repeated surname",
      value:topSurname[0],
      sub:`Appears ${topSurname[1]} time(s)`,
      accent:"var(--purple)"
    }
  ]);

  const congresses = allCongresses().sort((a,b) => congressNumber(b) - congressNumber(a));

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">🗺️ District Representative History</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Region</th>
            <th>District</th>
            ${congresses.map(c => `<th>${esc(c)}</th>`).join("")}
          </tr>
        </thead>

        <tbody>
          ${DB.districts.map(d => `
            <tr>
              <td>${esc(d.region)}</td>
              <td>${esc(d.district)}</td>
              ${congresses.map(c => {
                const names = d.terms
                  .filter(t => t.congress === c)
                  .map(t => t.full_name)
                  .join("; ");

                return `<td>${esc(names || "—")}</td>`;
              }).join("")}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderDynasties(){
  const surnameMap = {};

  DB.terms.forEach(t => {
    if(!t.surname) return;
    if(!surnameMap[t.surname]) surnameMap[t.surname] = [];
    surnameMap[t.surname].push(t);
  });

  const recurring = Object.entries(surnameMap)
    .filter(([surname, terms]) => terms.length >= 2)
    .sort((a,b) => b[1].length - a[1].length);

  const top = recurring[0] || ["—", []];

  setKpis([
    {
      label:"Recurring surnames",
      value:recurring.length,
      sub:"Surnames appearing 2+ times",
      accent:"var(--gold)"
    },
    {
      label:"Most repeated surname",
      value:top[0],
      sub:`${top[1].length || 0} tracked appearance(s)`,
      accent:"var(--red)",
      bar:Math.min((top[1].length || 0) * 10,100)
    },
    {
      label:"Possible dynasty signal",
      value:recurring.length,
      sub:"Based on repeated surname, not confirmed family relation",
      accent:"var(--purple)"
    },
    {
      label:"Total surname records",
      value:DB.terms.length,
      sub:"District-congress seat entries",
      accent:"var(--blue)"
    }
  ]);

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">👑 Recurring Surnames / Possible Dynasty Signals</div>
      <div class="notice">
        This section uses repeated surnames only. It does not automatically prove family relation.
      </div>
    </div>

    <div class="grid">
      ${recurring.map(([surname, terms]) => `
        <div class="card dynasty">
          <div class="card-name">${esc(surname)}</div>
          <div class="card-sub">${terms.length} tracked appearance(s)</div>

          ${terms.slice(0,8).map(t => `
            <div style="padding:9px 11px;background:var(--navy2);border-radius:8px;margin-top:7px">
              <b style="font-size:13px">${esc(t.full_name)}</b><br>
              <span style="color:var(--text3);font-size:12px">${esc(t.district)}</span><br>
              <span style="color:var(--gold-light);font-size:11px">${esc(t.congress)}</span>
            </div>
          `).join("")}
        </div>
      `).join("") || `<div class="error">No recurring surnames found yet.</div>`}
    </div>
  `;
}

function renderPartylists(){
  if(!DB.partylists.length){
    setKpis([
      {
        label:"Partylists tracked",
        value:0,
        sub:"No partylist.csv uploaded yet",
        accent:"var(--gold)"
      },
      {
        label:"Most consistent",
        value:"—",
        sub:"Waiting for partylist data",
        accent:"var(--green)"
      },
      {
        label:"Latest seat leader",
        value:"—",
        sub:"Waiting for partylist data",
        accent:"var(--blue)"
      },
      {
        label:"With AKA/name variants",
        value:0,
        sub:"Waiting for partylist data",
        accent:"var(--purple)"
      }
    ]);

    $("content").innerHTML = `
      <div class="panel">
        <div class="panel-title">🧾 Partylist Data Not Uploaded Yet</div>
        <div class="notice">
          House Reps, Districts, and Dynasties are already working.
          <br><br>
          Later, upload your partylist file as:
          <br>
          <code>data/partylist.csv</code>
        </div>
      </div>
    `;
    return;
  }

  const latestYear = latestElectionYear();

  const allResults = DB.partylists.flatMap(p =>
    p.results.map(r => ({...r, partylist_name:p.name}))
  );

  const latestResults = allResults.filter(r => num(r.election_year) === num(latestYear));
  const seatLeader = latestResults.slice().sort((a,b) => num(b.seats_won) - num(a.seats_won))[0];
  const mostConsistent = DB.partylists.slice().sort((a,b) => b.total_seat_terms - a.total_seat_terms)[0];
  const withAKA = DB.partylists.filter(p => p.aliases.length > 0).length;

  setKpis([
    {
      label:"Partylists tracked",
      value:DB.partylists.length,
      sub:"Unique partylist IDs",
      accent:"var(--gold)"
    },
    {
      label:"Most consistent",
      value:mostConsistent ? mostConsistent.name : "—",
      sub:`${mostConsistent ? mostConsistent.total_seat_terms : 0} total seat-term(s)`,
      accent:"var(--green)"
    },
    {
      label:"Latest seat leader",
      value:seatLeader ? seatLeader.partylist_name : "—",
      sub:`${seatLeader ? seatLeader.seats_won : 0} seat(s) in ${latestYear}`,
      accent:"var(--blue)"
    },
    {
      label:"With AKA/name variants",
      value:withAKA,
      sub:"Partylists with aliases",
      accent:"var(--purple)",
      bar:DB.partylists.length ? Math.round(withAKA / DB.partylists.length * 100) : 0
    }
  ]);

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">🧾 Search Partylists</div>
      <div class="search-grid">
        <div class="field-group">
          <label class="field-label">Search Partylist / AKA / Representative</label>
          <input class="search-input" id="plQ" oninput="drawPartylistCards()" placeholder="e.g. Akbayan, Tingog, APEC">
        </div>
      </div>
    </div>

    <div id="partyCards"></div>
  `;

  drawPartylistCards();
}

function drawPartylistCards(){
  const q = clean($("plQ") ? $("plQ").value : "").toLowerCase();

  const rows = DB.partylists.filter(p => {
    const text = `${p.name} ${p.aliases.join(" ")} ${p.representatives.map(r => r.representative_name).join(" ")}`.toLowerCase();
    return !q || text.includes(q);
  });

  $("partyCards").innerHTML = `
    <div class="results-count">Showing <span>${rows.length}</span> partylists</div>

    <div class="grid">
      ${rows.map(p => `
        <div class="card ${p.has_adverse_note ? "flagged" : ""}">
          <div class="card-name">${esc(p.name)}</div>
          <div class="card-sub">${esc(p.aliases.join(" · ") || p.partylist_id)}</div>

          <div class="tags">
            <span class="tag tag-green">${esc(p.latest_result ? p.latest_result.seats_won : 0)} latest seat(s)</span>
            <span class="tag tag-gold">${p.results.length} election record(s)</span>
            ${p.has_adverse_note ? `<span class="tag tag-red">⚠️ Notes</span>` : ""}
          </div>

          <div class="stats">
            <div>
              <div class="stat-val">${p.total_seat_terms}</div>
              <div class="stat-lbl">Seat-Terms</div>
            </div>

            <div>
              <div class="stat-val">${p.representatives.length}</div>
              <div class="stat-lbl">Reps</div>
            </div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderPartyNotes(){
  if(!DB.partylistNotes.length){
    setKpis([
      {
        label:"Total notes logged",
        value:0,
        sub:"No partylist notes yet",
        accent:"var(--gold)"
      },
      {
        label:"AKA/name notes",
        value:0,
        sub:"Waiting for partylist.csv",
        accent:"var(--purple)"
      },
      {
        label:"Legal/status flags",
        value:0,
        sub:"Waiting for partylist.csv",
        accent:"var(--red)"
      },
      {
        label:"Total aliases tracked",
        value:0,
        sub:"Waiting for partylist.csv",
        accent:"var(--blue)"
      }
    ]);

    $("content").innerHTML = `
      <div class="panel">
        <div class="panel-title">⚠️ No Partylist Notes Yet</div>
        <div class="notice">
          This page will populate after you upload:
          <br>
          <code>data/partylist.csv</code>
        </div>

    `;

  const akaNotes = DB.partylistNotes.filter(n =>

      label:"AKA/name notes",
      value:akaNotes.length,

    },
    {
      label:"Legal/status flags",
      value:legalNotes.length,
      sub:"Cancellation, case, or registration issues",
      accent:"var(--red)"
    },
    {
      label:"Total aliases tracked",
      value:aliases,
      sub:"AKA names in partylist.csv",

    }

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">⚠️ Partylist Notes & Status Flags</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Partylist</th>
            <th>Date</th>
            <th>Type</th>
            <th>Title</th>
            <th>Description</th>
          </tr>
        </thead>

        <tbody>
          ${DB.partylistNotes.map(n => `
            <tr>
              <td>${esc(n.partylist_name || n.partylist_id)}</td>
              <td>${esc(n.date || "—")}</td>
              <td style="color:var(--gold-light)">${esc(n.type || "—")}</td>
              <td>${esc(n.title || "—")}</td>
              <td>${esc(n.description || "—")}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

async function init(){
  try{
    const districtCSV = await fetchRequired(PATHS.districts);
    const overviewCSV = await fetchOptional(PATHS.overview);
    const partylistCSV = await fetchOptional(PATHS.partylist);

    const districtRows = parseCSV(districtCSV);
    const overviewRows = overviewCSV ? parseCSV(overviewCSV) : [];
    const partylistRows = partylistCSV ? parseCSV(partylistCSV) : [];

    const terms = convertWideDistrictCSV(districtRows);
    const reps = buildReps(terms);
    const districts = buildDistricts(terms);
    const partyData = buildPartylistData(partylistRows);

    DB = {
      terms,
      reps,
      districts,
      overview:overviewRows,
      partylists:partyData.partylists,
      partylistNotes:partyData.notes
    };

    if(!terms.length){
      throw new Error("The district CSV loaded, but no Congress data was detected. Check that your columns include 20th Congress, 19th Congress, 18th Congress, etc.");
    }

    showModule("reps");

  }catch(err){
    console.error(err);

    $("kpis").innerHTML = "";

    $("content").innerHTML = `
      <div class="error">
        <b>Database loading failed.</b><br><br>
        ${esc(err.message)}<br><br>
        This file is currently looking for:
        <br>
        <code>${esc(PATHS.districts)}</code><br>
        <code>${esc(PATHS.overview)}</code><br><br>
        Make sure those filenames match exactly in your GitHub <code>data</code> folder.
      </div>
    `;
  }
}

init();
</script>
