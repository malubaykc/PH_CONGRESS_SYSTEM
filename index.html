<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PH Congress Database</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9922A;--gold-light:#F0C96A;--gold-dim:#8B6520;
  --navy:#0A1628;--navy2:#112240;
  --surface:#0F1F38;--surface2:#162848;--surface3:#1E3254;
  --text:#E8EDF5;--text2:#A8B8CC;--text3:#6A82A0;
  --red:#E05252;--green:#3CB07A;--blue:#4A9EE0;--purple:#9B72CF;
  --border:#1E3254;--radius:12px;--warn-bg:#2A1A08;--warn-border:#8B6520;
}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh}
.header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#0D1F3C 100%);
  border-bottom:1px solid var(--gold-dim);padding:0 28px;position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:16px
}
.logo{display:flex;gap:12px;align-items:center}
.logo-flag{font-size:28px}
.logo-text{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:var(--gold-light)}
.logo-sub{font-size:11px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav-btn{padding:7px 13px;border:0;background:transparent;color:var(--text2);font:500 13px sans-serif;border-radius:8px;cursor:pointer}
.nav-btn:hover,.nav-btn.active{background:var(--surface3);color:var(--gold-light)}
.main{padding:24px 28px;max-width:1400px;margin:auto}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--gold))}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:500;margin-bottom:6px}
.kpi-value{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;line-height:1}
.kpi-sub{font-size:12px;color:var(--text3);margin-top:5px}
.kpi-bar{margin-top:10px;height:6px;background:var(--navy2);border-radius:999px;overflow:hidden}
.kpi-bar-fill{height:100%;background:var(--accent,var(--gold));border-radius:999px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px}
.panel-title{font-family:'Playfair Display',Georgia,serif;font-size:15px;color:var(--gold-light);margin-bottom:14px}
.search-grid{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr;gap:10px;align-items:end}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3)}
.search-input,.search-select{background:var(--navy2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:9px 12px;outline:none}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--text3);color:var(--text)}
.results-count{font-size:13px;color:var(--text3);margin-bottom:12px}
.results-count span{color:var(--gold-light);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,0,0,.3)}
.card.dynasty{border-color:var(--warn-border);background:var(--warn-bg)}
.card.flagged{border-color:#704040;background:#341919}
.card.dynasty:after{content:'👑';position:absolute;right:12px;top:12px}
.card.flagged:after{content:'⚠️';position:absolute;right:12px;top:12px}
.card-name{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;margin-bottom:4px;padding-right:26px}
.card-sub{font:12px monospace;color:var(--text3);margin-bottom:9px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500}
.tag-blue{background:#1E2F48;color:#7BADD4}
.tag-gold{background:#2A1F00;color:var(--gold-light);border:1px solid var(--gold-dim)}
.tag-green{background:#1A3520;color:#5ECC7B;border:1px solid #2E6040}
.tag-red{background:#341919;color:#FF9999;border:1px solid #704040}
.stats{display:flex;gap:14px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.stat-val{font:500 17px monospace;color:var(--text)}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase}
.table-wrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface2);color:var(--text2);padding:11px 13px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody td{padding:9px 13px;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--surface2)}
.insight-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.insight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.insight-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:10px}
.bar-list{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:160px 1fr 50px;gap:10px;align-items:center;font-size:12px;color:var(--text2)}
.bar-bg{height:8px;background:var(--navy2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px}
.loading{padding:30px;color:var(--text3);text-align:center}
.error{background:#341919;border:1px solid #704040;color:#FF9999;padding:16px;border-radius:12px;margin-bottom:16px}
@media(max-width:900px){.kpi-row,.insight-row{grid-template-columns:1fr 1fr}.search-grid{grid-template-columns:1fr 1fr}.header{flex-direction:column;align-items:flex-start;padding:12px 16px}.main{padding:16px}}
@media(max-width:600px){.kpi-row,.search-grid,.insight-row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <span class="logo-flag">🇵🇭</span>
    <div>
      <div class="logo-text">PH Congress Database</div>
      <div class="logo-sub">District Representatives + Partylist System</div>
    </div>
  </div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showModule('reps')">🏛️ House Reps</button>
    <button class="nav-btn" onclick="showModule('districts')">🗺️ Districts</button>
    <button class="nav-btn" onclick="showModule('dynasties')">👑 Dynasties</button>
    <button class="nav-btn" onclick="showModule('partylists')">🧾 Partylists</button>
    <button class="nav-btn" onclick="showModule('partyNotes')">⚠️ Partylist Notes</button>
  </nav>
</header>

<main class="main">
  <div class="kpi-row" id="kpis"></div>
  <div id="content" class="loading">Loading database...</div>
</main>

<script>
/*
  CHANGE THIS ONLY:

  "csv"  = website reads CSV files directly from /data/
  "json" = website reads data/congress_database.json

  Recommended:
  - Use "csv" if you want the simplest upload-and-refresh system.
  - Use "json" if you want cleaner and faster display for bigger datasets.
*/
const DATA_MODE = "csv";

const PATHS = {
  json: "data/congress_database.json",

  reps: "data/source-house-representatives.csv",
  houseTerms: "data/source-house-terms.csv",
  partylistResults: "data/source-partylist-results.csv",
  partylistRepresentatives: "data/source-partylist-representatives.csv",
  partylistNotes: "data/source-partylist-notes.csv"
};

let DB = {
  reps: [],
  houseTerms: [],
  districts: [],
  partylists: [],
  partylistResults: [],
  partylistRepresentatives: [],
  partylistNotes: []
};

let current = "reps";

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function val(row, names, fallback = ""){
  for(const name of names){
    if(row[name] !== undefined && row[name] !== null && String(row[name]).trim() !== ""){
      return String(row[name]).trim();
    }
  }
  return fallback;
}

function num(v){
  const n = Number(String(v ?? "").replace(/,/g,"").trim());
  return Number.isFinite(n) ? n : 0;
}

function slug(v){
  return String(v ?? "")
    .toLowerCase()
    .replace(/["']/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function getSurname(name){
  const clean = String(name ?? "").trim();
  if(!clean) return "";
  if(clean.includes(",")) return clean.split(",")[0].trim();
  const parts = clean.split(/\s+/);
  return parts[parts.length - 1] || clean;
}

function parseCSV(text){
  const rows = [];
  let row = [], cell = "", insideQuotes = false;

  for(let i = 0; i < text.length; i++){
    const char = text[i];
    const next = text[i + 1];

    if(char === '"' && insideQuotes && next === '"'){
      cell += '"';
      i++;
    } else if(char === '"'){
      insideQuotes = !insideQuotes;
    } else if(char === "," && !insideQuotes){
      row.push(cell);
      cell = "";
    } else if((char === "\n" || char === "\r") && !insideQuotes){
      if(char === "\r" && next === "\n") i++;
      row.push(cell);
      if(row.some(x => String(x).trim() !== "")) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += char;
    }
  }

  row.push(cell);
  if(row.some(x => String(x).trim() !== "")) rows.push(row);

  if(!rows.length) return [];

  const headers = rows[0].map(h => String(h).trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ?? "");
    return obj;
  });
}

async function fetchText(path){
  const res = await fetch(path + "?v=" + Date.now());
  if(!res.ok) throw new Error("Could not load " + path);
  return await res.text();
}

async function loadCSVDatabase(){
  const [repsCSV, termsCSV, plResultsCSV, plRepsCSV, plNotesCSV] = await Promise.all([
    fetchText(PATHS.reps),
    fetchText(PATHS.houseTerms),
    fetchText(PATHS.partylistResults),
    fetchText(PATHS.partylistRepresentatives),
    fetchText(PATHS.partylistNotes)
  ]);

  const rawReps = parseCSV(repsCSV);
  const rawTerms = parseCSV(termsCSV);
  const rawPLResults = parseCSV(plResultsCSV);
  const rawPLReps = parseCSV(plRepsCSV);
  const rawPLNotes = parseCSV(plNotesCSV);

  return normalizeFromCSV(rawReps, rawTerms, rawPLResults, rawPLReps, rawPLNotes);
}

async function loadJSONDatabase(){
  const res = await fetch(PATHS.json + "?v=" + Date.now());
  if(!res.ok) throw new Error("Could not load " + PATHS.json);
  const data = await res.json();

  return {
    reps: data.reps || [],
    houseTerms: data.houseTerms || data.house_terms || [],
    districts: data.districts || [],
    partylists: data.partylists || [],
    partylistResults: data.partylistResults || data.partylist_results || [],
    partylistRepresentatives: data.partylistRepresentatives || data.partylist_representatives || [],
    partylistNotes: data.partylistNotes || data.partylist_notes || []
  };
}

function normalizeFromCSV(rawReps, rawTerms, rawPLResults, rawPLReps, rawPLNotes){
  const houseTerms = rawTerms.map(r => {
    const repId = val(r, ["rep_id","id","representative_id"]) || slug(val(r, ["full_name","name","representative_name"]));
    const fullName = val(r, ["full_name","name","representative_name"]);
    const province = val(r, ["province"]);
    const districtName = val(r, ["district","district_name","legislative_district"]);
    return {
      rep_id: repId,
      full_name: fullName,
      congress: val(r, ["congress"]),
      election_year: val(r, ["election_year","year"]),
      region: val(r, ["region"]),
      province,
      district: districtName,
      district_id: val(r, ["district_id"]) || slug(province + "-" + districtName),
      seat_type: val(r, ["seat_type"], "District"),
      party: val(r, ["party","political_party"]),
      leadership: val(r, ["leadership","position"]),
      source_url: val(r, ["source_url","source"])
    };
  });

  const repsMap = new Map();

  rawReps.forEach(r => {
    const id = val(r, ["rep_id","id","representative_id"]) || slug(val(r, ["full_name","name","representative_name"]));
    if(!id) return;

    repsMap.set(id, {
      rep_id: id,
      full_name: val(r, ["full_name","name","representative_name"]),
      surname: val(r, ["surname","last_name"]) || getSurname(val(r, ["full_name","name","representative_name"])),
      sex: val(r, ["sex","gender"]),
      clan: val(r, ["clan","family","dynasty"]),
      notes: val(r, ["notes","remarks"]),
      terms: []
    });
  });

  houseTerms.forEach(t => {
    if(!repsMap.has(t.rep_id)){
      repsMap.set(t.rep_id, {
        rep_id: t.rep_id,
        full_name: t.full_name || t.rep_id,
        surname: getSurname(t.full_name),
        sex: "",
        clan: "",
        notes: "",
        terms: []
      });
    }
    repsMap.get(t.rep_id).terms.push(t);
  });

  const reps = Array.from(repsMap.values());

  const districtsMap = new Map();
  houseTerms.forEach(t => {
    const id = t.district_id || slug(t.province + "-" + t.district);
    if(!districtsMap.has(id)){
      districtsMap.set(id, {
        district_id: id,
        region: t.region,
        province: t.province,
        district: t.district,
        terms: []
      });
    }
    districtsMap.get(id).terms.push(t);
  });

  const districts = Array.from(districtsMap.values());

  const partylistResults = rawPLResults.map(r => {
    const id = val(r, ["partylist_id","id"]) || slug(val(r, ["partylist_name","main_name","name"]));
    return {
      partylist_id: id,
      name: val(r, ["partylist_name","main_name","name"]),
      alias: val(r, ["alias","aka","also_known_as"]),
      sector: val(r, ["sector"]),
      election_year: val(r, ["election_year","year"]),
      congress: val(r, ["congress"]),
      seats_won: num(val(r, ["seats_won","seats","latest_seats"])),
      status: val(r, ["status"]),
      notes: val(r, ["general_notes","notes","remarks"]),
      source_url: val(r, ["source_url","source"])
    };
  });

  const partylistRepresentatives = rawPLReps.map(r => {
    const id = val(r, ["partylist_id","id"]) || slug(val(r, ["partylist_name","main_name","name"]));
    return {
      partylist_id: id,
      congress: val(r, ["congress"]),
      election_year: val(r, ["election_year","year"]),
      seat_no: val(r, ["seat_no","seat_number","nominee_no"]),
      representative_name: val(r, ["representative_name","nominee_name","name"])
    };
  });

  const partylistNotes = rawPLNotes.map(r => {
    const id = val(r, ["partylist_id","id"]) || slug(val(r, ["partylist_name","main_name","name"]));
    return {
      partylist_id: id,
      date: val(r, ["date","year"]),
      type: val(r, ["type","note_type","category"]),
      title: val(r, ["title","note_title"]),
      description: val(r, ["description","details","notes"]),
      source_url: val(r, ["source_url","source"])
    };
  });

  const plMap = new Map();

  partylistResults.forEach(r => {
    if(!plMap.has(r.partylist_id)){
      plMap.set(r.partylist_id, {
        partylist_id: r.partylist_id,
        name: r.name || r.partylist_id,
        aliases: new Set(),
        sector: r.sector,
        results: [],
        representatives: [],
        notes: []
      });
    }

    const p = plMap.get(r.partylist_id);
    if(r.name && p.name === r.partylist_id) p.name = r.name;
    if(r.alias) p.aliases.add(r.alias);
    if(r.name && r.name !== p.name) p.aliases.add(r.name);
    p.results.push(r);
  });

  partylistRepresentatives.forEach(r => {
    if(!plMap.has(r.partylist_id)){
      plMap.set(r.partylist_id, {
        partylist_id: r.partylist_id,
        name: r.partylist_id,
        aliases: new Set(),
        sector: "",
        results: [],
        representatives: [],
        notes: []
      });
    }
    plMap.get(r.partylist_id).representatives.push(r);
  });

  partylistNotes.forEach(n => {
    if(!plMap.has(n.partylist_id)){
      plMap.set(n.partylist_id, {
        partylist_id: n.partylist_id,
        name: n.partylist_id,
        aliases: new Set(),
        sector: "",
        results: [],
        representatives: [],
        notes: []
      });
    }
    plMap.get(n.partylist_id).notes.push(n);
  });

  const partylists = Array.from(plMap.values()).map(p => ({
    ...p,
    aliases: Array.from(p.aliases),
    total_seat_terms: p.results.reduce((s,r) => s + Number(r.seats_won || 0), 0),
    latest_result: p.results.slice().sort((a,b) => Number(b.election_year) - Number(a.election_year))[0] || null,
    has_adverse_note: p.notes.some(n => /legal|case|cancel|disqual|status|adverse/i.test(n.type + " " + n.title + " " + n.description))
  }));

  return {
    reps,
    houseTerms,
    districts,
    partylists,
    partylistResults,
    partylistRepresentatives,
    partylistNotes
  };
}

function allCongresses(){
  const set = new Set();
  DB.houseTerms.forEach(t => t.congress && set.add(t.congress));
  DB.partylistResults.forEach(r => r.congress && set.add(r.congress));
  return Array.from(set).sort((a,b) => parseInt(a) - parseInt(b));
}

function latestCongress(){
  const congresses = allCongresses();
  return congresses[congresses.length - 1] || "";
}

function latestElectionYear(){
  const years = [
    ...DB.houseTerms.map(t => num(t.election_year)),
    ...DB.partylistResults.map(r => num(r.election_year))
  ].filter(Boolean);
  return Math.max(...years, 0);
}

function setKpis(items){
  $("kpis").innerHTML = items.map(k => `
    <div class="kpi" style="--accent:${k.accent}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${esc(k.value)}</div>
      <div class="kpi-sub">${esc(k.sub)}</div>
      ${k.bar != null ? `<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${k.bar}%;background:${k.accent}"></div></div>` : ""}
    </div>
  `).join("");
}

function showModule(module){
  current = module;
  document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
  const index = ["reps","districts","dynasties","partylists","partyNotes"].indexOf(module);
  document.querySelectorAll(".nav-btn")[index]?.classList.add("active");

  if(module === "reps") renderReps();
  if(module === "districts") renderDistricts();
  if(module === "dynasties") renderDynasties();
  if(module === "partylists") renderPartylists();
  if(module === "partyNotes") renderPartyNotes();
}

function getTopSurname(){
  const freq = {};
  DB.houseTerms.forEach(t => {
    const s = getSurname(t.full_name);
    if(s) freq[s] = (freq[s] || 0) + 1;
  });
  return Object.entries(freq).sort((a,b) => b[1] - a[1])[0] || ["—",0];
}

function renderReps(){
  const latest = latestCongress();
  const topRep = DB.reps.slice().sort((a,b) => b.terms.length - a.terms.length)[0];
  const latestTerms = DB.houseTerms.filter(t => t.congress === latest);
  const returning = latestTerms.filter(t => {
    return DB.houseTerms.some(x => x.rep_id === t.rep_id && x.congress !== latest);
  }).length;
  const retentionRate = latestTerms.length ? Math.round((returning / latestTerms.length) * 100) : 0;

  setKpis([
    {label:"Total reps tracked", value:DB.reps.length, sub:"Unique representatives in dataset", accent:"var(--gold)"},
    {label:"Longest-serving rep", value:topRep?.surname || "—", sub:`${topRep?.terms.length || 0} tracked congress appearance(s)`, accent:"var(--blue)", bar:Math.min((topRep?.terms.length || 0) * 20, 100)},
    {label:"Returning latest reps", value:returning, sub:`Returned in ${latest || "latest congress"}`, accent:"var(--green)", bar:retentionRate},
    {label:"Latest retention rate", value:retentionRate + "%", sub:"Share of latest reps with prior terms", accent:"var(--purple)", bar:retentionRate}
  ]);

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">🔍 Search & Filter House Representatives</div>
      <div class="search-grid">
        <div class="field-group">
          <label class="field-label">Search Name / District / Province</label>
          <input class="search-input" id="repQ" oninput="drawRepCards()" placeholder="e.g. Marcos, Leyte, Akbayan">
        </div>
        <div class="field-group">
          <label class="field-label">Congress</label>
          <select class="search-select" id="repC" onchange="drawRepCards()">
            <option value="">All Congresses</option>
            ${allCongresses().map(c => `<option>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Filter</label>
          <select class="search-select" id="repF" onchange="drawRepCards()">
            <option value="">All</option>
            <option value="returning">Returning only</option>
            <option value="dynasty">Dynasty-tagged only</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">&nbsp;</label>
          <button class="btn" onclick="document.getElementById('repQ').value='';document.getElementById('repC').value='';document.getElementById('repF').value='';drawRepCards()">✕ Clear</button>
        </div>
      </div>
    </div>
    <div id="repCards"></div>
  `;

  drawRepCards();
}

function drawRepCards(){
  const q = ($("repQ").value || "").toLowerCase();
  const c = $("repC").value;
  const f = $("repF").value;
  const latest = latestCongress();

  const rows = DB.reps.filter(r => {
    const terms = r.terms || [];
    const text = `${r.full_name} ${r.surname} ${r.clan} ${terms.map(t => `${t.region} ${t.province} ${t.district} ${t.congress}`).join(" ")}`.toLowerCase();
    const hasCongress = !c || terms.some(t => t.congress === c);
    const isReturning = terms.some(t => t.congress === latest) && terms.some(t => t.congress !== latest);

    return (!q || text.includes(q)) &&
           hasCongress &&
           (!f ||
             (f === "returning" && isReturning) ||
             (f === "dynasty" && r.clan) ||
             (f === "female" && /^f/i.test(r.sex)));
  });

  $("repCards").innerHTML = `
    <div class="results-count">Showing <span>${rows.length}</span> representatives</div>
    <div class="grid">
      ${rows.map(r => {
        const terms = r.terms || [];
        const first = terms.slice().sort((a,b) => parseInt(a.congress) - parseInt(b.congress))[0];
        const last = terms.slice().sort((a,b) => parseInt(b.congress) - parseInt(a.congress))[0];

        return `
          <div class="card ${r.clan ? "dynasty" : ""}">
            <div class="card-name">${esc(r.full_name)}</div>
            <div class="card-sub">${esc(last?.province || "")} ${esc(last?.district || "")}</div>
            <div class="tags">
              ${last?.region ? `<span class="tag tag-blue">${esc(last.region)}</span>` : ""}
              ${r.clan ? `<span class="tag tag-gold">👑 ${esc(r.clan)}</span>` : ""}
              ${last?.leadership ? `<span class="tag tag-green">${esc(last.leadership)}</span>` : ""}
            </div>
            <div class="stats">
              <div><div class="stat-val">${terms.length}</div><div class="stat-lbl">Terms</div></div>
              <div style="flex:1;font-size:11px;color:var(--text3)">
                First: ${esc(first?.congress || "—")}<br>
                Last: ${esc(last?.congress || "—")}
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderDistricts(){
  const latest = latestCongress();
  const latestDistricts = DB.districts.filter(d => d.terms.some(t => t.congress === latest));
  const stable = DB.districts.filter(d => new Set(d.terms.map(t => t.rep_id)).size === 1 && d.terms.length > 1).length;
  const changed = latestDistricts.filter(d => {
    const latestTerm = d.terms.find(t => t.congress === latest);
    return d.terms.some(t => t.congress !== latest && t.rep_id !== latestTerm?.rep_id);
  }).length;
  const turnover = latestDistricts.length ? Math.round((changed / latestDistricts.length) * 100) : 0;
  const topSurname = getTopSurname();

  setKpis([
    {label:"Districts tracked", value:DB.districts.length, sub:"Unique district records", accent:"var(--gold)"},
    {label:"Stable districts", value:stable, sub:"Same rep across multiple tracked congresses", accent:"var(--green)", bar:DB.districts.length ? Math.round(stable / DB.districts.length * 100) : 0},
    {label:"Latest turnover rate", value:turnover + "%", sub:`Districts that changed holder in ${latest || "latest congress"}`, accent:"var(--red)", bar:turnover},
    {label:"Most repeated surname", value:topSurname[0], sub:`Appears ${topSurname[1]} time(s) in district history`, accent:"var(--purple)"}
  ]);

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">🗺️ District Representative History</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Region</th>
            <th>Province</th>
            <th>District</th>
            <th>Tracked Terms</th>
            <th>Latest Representative</th>
          </tr>
        </thead>
        <tbody>
          ${DB.districts.map(d => {
            const latestTerm = d.terms.slice().sort((a,b) => parseInt(b.congress) - parseInt(a.congress))[0];
            return `
              <tr>
                <td>${esc(d.region)}</td>
                <td>${esc(d.province)}</td>
                <td>${esc(d.district)}</td>
                <td>${d.terms.length}</td>
                <td>${esc(latestTerm?.full_name || "—")}</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderDynasties(){
  const clans = {};
  DB.reps.forEach(r => {
    if(r.clan) {
      if(!clans[r.clan]) clans[r.clan] = [];
      clans[r.clan].push(r);
    }
  });

  const topSurname = getTopSurname();
  const dynastyTerms = DB.reps.filter(r => r.clan).reduce((s,r) => s + r.terms.length, 0);
  const allTerms = DB.reps.reduce((s,r) => s + r.terms.length, 0);
  const share = allTerms ? Math.round(dynastyTerms / allTerms * 100) : 0;

  setKpis([
    {label:"Confirmed families", value:Object.keys(clans).length, sub:"Based on clan/dynasty column", accent:"var(--gold)"},
    {label:"Dynasty-tagged terms", value:dynastyTerms, sub:"Total congress appearances by tagged reps", accent:"var(--red)", bar:share},
    {label:"Dynasty term share", value:share + "%", sub:"Share of all tracked rep terms", accent:"var(--purple)", bar:share},
    {label:"Recurring surname", value:topSurname[0], sub:`Appears ${topSurname[1]} time(s)`, accent:"var(--blue)"}
  ]);

  $("content").innerHTML = `
    <div class="grid">
      ${Object.entries(clans).map(([clan, members]) => `
        <div class="card dynasty">
          <div class="card-name">${esc(clan)} Family</div>
          <div class="card-sub">${members.length} member(s) · ${members.reduce((s,m) => s + m.terms.length, 0)} total term(s)</div>
          ${members.map(m => `
            <div style="padding:9px 11px;background:var(--navy2);border-radius:8px;margin-top:7px">
              <b style="font-size:13px">${esc(m.full_name)}</b><br>
              <span style="color:var(--text3);font-size:12px">${esc(m.terms.at(-1)?.province || "")} ${esc(m.terms.at(-1)?.district || "")}</span><br>
              <span style="color:var(--gold-light);font-size:11px">${m.terms.map(t => esc(t.congress)).join(" · ")}</span>
            </div>
          `).join("")}
        </div>
      `).join("") || `<div class="error">No dynasty/clan data found. Add a <b>clan</b> column in the representatives CSV.</div>`}
    </div>
  `;
}

function renderPartylists(){
  const latestYear = latestElectionYear();
  const latestResults = DB.partylistResults.filter(r => num(r.election_year) === latestYear);
  const topLatest = latestResults.slice().sort((a,b) => b.seats_won - a.seats_won)[0];
  const mostConsistent = DB.partylists.slice().sort((a,b) => b.total_seat_terms - a.total_seat_terms)[0];
  const akaCount = DB.partylists.filter(p => p.aliases.length > 0).length;

  setKpis([
    {label:"Partylists tracked", value:DB.partylists.length, sub:"Unique partylist IDs", accent:"var(--gold)"},
    {label:"Most consistent", value:mostConsistent?.name || "—", sub:`${mostConsistent?.total_seat_terms || 0} total seat-term(s)`, accent:"var(--green)"},
    {label:"Latest seat leader", value:topLatest?.name || "—", sub:`${topLatest?.seats_won || 0} seat(s) in ${latestYear || "latest year"}`, accent:"var(--blue)", bar:topLatest ? Math.min(topLatest.seats_won / 3 * 100, 100) : 0},
    {label:"With AKA/name variants", value:akaCount, sub:"Partylists with aliases or name variations", accent:"var(--purple)", bar:DB.partylists.length ? Math.round(akaCount / DB.partylists.length * 100) : 0}
  ]);

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">🧾 Search & Filter Partylists</div>
      <div class="search-grid">
        <div class="field-group">
          <label class="field-label">Search Partylist / AKA / Nominee</label>
          <input class="search-input" id="plQ" oninput="drawPartylistCards()" placeholder="e.g. Akbayan, APEC, Tingog">
        </div>
        <div class="field-group">
          <label class="field-label">Congress</label>
          <select class="search-select" id="plC" onchange="drawPartylistCards()">
            <option value="">All Congresses</option>
            ${allCongresses().map(c => `<option>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Status</label>
          <select class="search-select" id="plF" onchange="drawPartylistCards()">
            <option value="">All</option>
            <option value="with_seats">With seats</option>
            <option value="aka">With AKA</option>
            <option value="flagged">With notes/issues</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">&nbsp;</label>
          <button class="btn" onclick="document.getElementById('plQ').value='';document.getElementById('plC').value='';document.getElementById('plF').value='';drawPartylistCards()">✕ Clear</button>
        </div>
      </div>
    </div>
    <div id="partyCards"></div>
  `;

  drawPartylistCards();
}

function drawPartylistCards(){
  const q = ($("plQ").value || "").toLowerCase();
  const c = $("plC").value;
  const f = $("plF").value;

  const rows = DB.partylists.filter(p => {
    const text = `${p.name} ${p.aliases.join(" ")} ${p.representatives.map(r => r.representative_name).join(" ")}`.toLowerCase();
    const hasCongress = !c || p.results.some(r => r.congress === c) || p.representatives.some(r => r.congress === c);
    const withSeats = p.results.some(r => r.seats_won > 0);

    return (!q || text.includes(q)) &&
           hasCongress &&
           (!f ||
             (f === "with_seats" && withSeats) ||
             (f === "aka" && p.aliases.length) ||
             (f === "flagged" && p.has_adverse_note));
  });

  $("partyCards").innerHTML = `
    <div class="results-count">Showing <span>${rows.length}</span> partylists</div>
    <div class="grid">
      ${rows.map(p => {
        const latest = p.latest_result;
        return `
          <div class="card ${p.has_adverse_note ? "flagged" : ""}">
            <div class="card-name">${esc(p.name)}</div>
            <div class="card-sub">${esc(p.aliases.join(" · ") || p.partylist_id)}</div>
            <div class="tags">
              <span class="tag tag-green">${latest?.seats_won || 0} latest seat(s)</span>
              <span class="tag tag-gold">${p.results.length} election(s)</span>
              ${p.has_adverse_note ? `<span class="tag tag-red">⚠️ Notes</span>` : ""}
            </div>
            <div class="stats">
              <div><div class="stat-val">${p.total_seat_terms}</div><div class="stat-lbl">Seat-Terms</div></div>
              <div><div class="stat-val">${p.representatives.length}</div><div class="stat-lbl">Reps</div></div>
              <div style="font-size:12px;color:var(--text3);flex:1">
                Latest: ${esc(latest?.election_year || "—")}<br>
                ${esc(latest?.status || "No flag")}
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderPartyNotes(){
  const akaNotes = DB.partylistNotes.filter(n => /aka|alias|variation|name/i.test(n.type + " " + n.title + " " + n.description));
  const legalNotes = DB.partylistNotes.filter(n => /legal|case|cancel|disqual|registration/i.test(n.type + " " + n.title + " " + n.description));
  const aliasTotal = DB.partylists.reduce((s,p) => s + p.aliases.length, 0);

  setKpis([
    {label:"Total notes logged", value:DB.partylistNotes.length, sub:"Across all partylists", accent:"var(--gold)"},
    {label:"AKA/name notes", value:akaNotes.length, sub:"Name variation documentation", accent:"var(--purple)"},
    {label:"Legal/status flags", value:legalNotes.length, sub:"Cancellation, registration, or legal notes", accent:"var(--red)"},
    {label:"Total aliases tracked", value:aliasTotal, sub:"AKA names from partylist data", accent:"var(--blue)"}
  ]);

  $("content").innerHTML = `
    <div class="panel">
      <div class="panel-title">⚠️ Partylist Notes & Status Flags</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Partylist ID</th>
            <th>Date</th>
            <th>Type</th>
            <th>Title</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          ${DB.partylistNotes.map(n => `
            <tr>
              <td>${esc(n.partylist_id)}</td>
              <td>${esc(n.date || "—")}</td>
              <td style="color:var(--gold-light)">${esc(n.type || "—")}</td>
              <td>${esc(n.title || "—")}</td>
              <td>${esc(n.description || "—")}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

async function init(){
  try{
    DB = DATA_MODE === "json" ? await loadJSONDatabase() : await loadCSVDatabase();
    showModule("reps");
  } catch(err){
    console.error(err);
    $("kpis").innerHTML = "";
    $("content").innerHTML = `
      <div class="error">
        <b>Database loading failed.</b><br><br>
        ${esc(err.message)}<br><br>
        Check that your data files exist in the correct folder and have the correct names.
      </div>
    `;
  }
}

init();
</script>

</body>
</html>
